/* ---------------- Hall of Fame: arcade high scores, one board per game ----------------
   The database keeps only the first name, the cat's look, the warrior rank and the scores.
   Grown-ups can hide a player (Grown-ups corner); hidden players never appear on any board and stop posting. */
const HOF_GAMES={
  siege:{key:'warrior:siege',name:'CATAPULT SIEGE',title:'Catapult Siege',best:()=>bonusState().best,how:'Beat a guardian, play Catapult Siege, and be the first!'},
  blade:{key:'warrior:blade',name:'HALVING BLADE',title:'Halving Blade',best:()=>bonusState().hbBest,how:'Play Halving Blade in Training and be the first!'}};
/* Practice boards use accuracy, never speed, for untimed maths rounds.
   Keys include the academy, age band and activity; original arcade keys stay unchanged. */
const PRACTICE_BANDS={big:'Warrior training'};
for(const [b,group] of Object.entries(PRACTICE_BANDS)){
  const activities=b==='little'?['quick_count','quick_teens','quick_add10','quick_sub10','quick_share','quick_groups']:
    b==='middle'?['quick_add20','quick_sub20','quick_div',...range(2,12).map(t=>'table'+t)]:
    [...range(2,12).map(t=>'table'+t),...range(2,12).map(t=>'dtable'+t),'quick_dec','quick_mixed4',...NEW_REALM_IDS.map(id=>'quick_'+id),'quick_add20','quick_sub20'];
  for(const activity of [...activities,'garden','lightning']){
    const id=practiceId(activity,b),title=activity.startsWith('quick_')?QUICK[activity.slice(6)].t:
      activity.startsWith('dtable')?'÷'+activity.slice(6)+' division':activity.startsWith('table')?'×'+activity.slice(5)+' times table':activity==='garden'?'Review Forge':'Lightning Round';
    HOF_GAMES[id]={key:'warrior:'+b+':'+activity,title,name:title,group,accuracy:activity!=='lightning',
      best:()=>practiceRecord(id).best||0,how:'Finish a round to join this board!'};
  }
}
function practiceId(activity,b=band()){return 'practice_'+b+'_'+activity}
function practiceGameId(mode,qk,t){
  const activity=mode==='quick'?'quick_'+qk:mode==='table'?'table'+t:mode==='dtable'?'dtable'+t:mode;
  const id=practiceId(activity);return HOF_GAMES[id]?id:null;
}
function practiceRecord(id){return S.practiceScores&&S.practiceScores[id]||{}}
function practiceWeek(){const d=new Date();d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)}
function mergePracticeRecords(other){
  if(!other||typeof other!=='object')return;S.practiceScores=S.practiceScores||{};
  for(const [id,c] of Object.entries(other)){
    if(!c||typeof c!=='object')continue;const r=S.practiceScores[id]||(S.practiceScores[id]={});
    for(const k of ['best','plays','answered','firstTry','combo'])r[k]=Math.max(r[k]||0,c[k]||0);
    if(c.pending&&(!r.pending||c.pending.week>r.pending.week||(c.pending.week===r.pending.week&&c.pending.score>r.pending.score)))r.pending={...c.pending};
  }
}
function recordPracticeRound(){
  if(!P||P.hofRecorded||!HOF_GAMES[P.hofGame])return;
  if(P.mode!=='lightning'&&P.credits.length!==P.n)return; // Unfinished rounds never count.
  P.hofRecorded=true;const id=P.hofGame,G=HOF_GAMES[id],right=P.mode==='lightning'?P.score:P.credits.filter(c=>c===1).length;
  const total=P.mode==='lightning'?(P.hofAttempts||0):P.n,score=G.accuracy?Math.round(right/Math.max(1,total)*100):P.score;
  S.practiceScores=S.practiceScores||{};const r=S.practiceScores[id]||(S.practiceScores[id]={});
  r.best=Math.max(r.best||0,score);r.plays=(r.plays||0)+1;r.answered=(r.answered||0)+total;r.firstTry=(r.firstTry||0)+right;r.combo=Math.max(r.combo||0,P.maxCombo||0);
  const week=practiceWeek();r.pending={week,score:Math.max(r.pending&&r.pending.week===week?r.pending.score:0,score)};
  P.hofScore=score;save();practiceBoardFlush();
}
let practiceFlush=null;
function practiceBoardFlush(){
  if(practiceFlush)return practiceFlush;
  if(!boardOn())return Promise.resolve();
  const owner=boardName();
  practiceFlush=(async()=>{
    for(const [id,r] of Object.entries(S.practiceScores||{})){
      if(boardName()!==owner||!boardOn())return;
      if(!r.pending||!HOF_GAMES[id])continue;
      const pending={...r.pending},weekly=pending.week===practiceWeek();
      const bestResult=await boardSubmit(id,r.best,false);
      if(boardName()!==owner||!boardOn())return;
      const result=weekly?await boardSubmit(id,pending.score,true):bestResult;
      if(bestResult&&bestResult.ok&&result&&result.ok&&r.pending&&r.pending.week===pending.week&&r.pending.score===pending.score){delete r.pending;persistLocal()}
    }
  })().finally(()=>{practiceFlush=null});return practiceFlush;
}
function hofScore(score,G){return G.accuracy?Math.max(0,Math.min(100,Number(score)||0))+'%':String(Number(score)||0).padStart(5,'0')}
function practiceHofButton(activity){const id=practiceId(activity),G=HOF_GAMES[id];return G?`<button class="chip hofbtn" data-act="hof" data-g="${id}" aria-label="${esc(G.title)} Hall of Fame">🏆</button>`:''}
function practiceBest(activity){const id=practiceId(activity),r=practiceRecord(id);return r.plays?`<span class="practice-best">Best: ${hofScore(r.best,HOF_GAMES[id])}</span>`:''}
function practiceHallCard(){return `<div class="pcard"><div class="pi">🏆</div><div class="grow"><h3>Hall of Fame</h3><p>Every practice game. Every player. Browse weekly and all-time records!</p></div><button class="btn sun" data-act="hof" data-g="${practiceId('lightning')}">View</button></div>`}
function practiceStatsHTML(id){const r=practiceRecord(id);return !r.plays?'':`<div class="hof-personal">Your practice: <b>${r.plays}</b> completed round${r.plays===1?'':'s'} · <b>${r.firstTry||0}/${r.answered||0}</b> first try · best combo <b>${r.combo||0}</b><br>Personal best: <b>${hofScore(r.best,HOF_GAMES[id])}</b>${r.pending?'<br>Your result is saved. It will post when cloud save is available.':''}</div>`}
function practiceResultHTML(){if(!P||!P.hofRecorded)return '';const G=HOF_GAMES[P.hofGame];return `<div class="practice-result"><b>${G.accuracy?'First-try accuracy':'Round score'}: ${hofScore(P.hofScore,G)}</b><br><button class="chip" data-act="practiceHof" data-g="${P.hofGame}">🏆 Hall of Fame</button></div>`}

function boardOn(){return !!S.cloud&&!!S.pinHash&&!S.settings.hideBoard}
async function boardSubmit(g,score,weekly=true){if(!boardOn()||!HOF_GAMES[g])return null;

const HOF_MED=['🥇','🥈','🥉'];
function hofRows(top,G){if(!top.length)return `<div class="hof-empty">NO SCORES YET<br><small>${G.how}</small></div>`;

async function openBoard(period,game){

function friendCat(c){c=c||{};const eq={};for(const s of Object.keys(SLOTS)){const id=c.e&&c.e[s];eq[s]=(id&&ITEM[id]&&ITEM[id].slot===s)?id:null}

function friendsView(){

  if(!d)return head+`<div class="notes">${UI.frErr==='net'?'<p>Hmm, I can’t reach the internet right now.</p><button class="chip" data-act="frRetry">↻ Try again</button>':UI.frErr==='wait'?'<p>Your game is still saving to the cloud. Try again in a moment.</p><button class="chip" data-act="frRetry">↻ Try again</button>':'<p class="blink">Loading your friends…</p>'}</div>`;

/* ---------------- daily gift & streak ---------------- */
function checkDaily(){
  const t=dayKey();if(!S.name||S.giftDay===t||needsSetup())return;
  const last=S.streak.last;let napped=false;
  if(!last)S.streak.count=1;
  else{const gap=daysBetween(last,t);if(gap===1)S.streak.count++;else if(gap===2){S.streak.count++;napped=true}else if(gap>2)S.streak.count=1}
  S.streak.last=t;S.giftDay=t;
  const day=S.streak.count,y=10+5*Math.min(day,6);S.yarn+=y;
  let st=null;if(day%7===0)st=rollReward(true);
  if(day>=3)badge('streak3');if(day>=7)badge('streak7');save();
  const wk=((day-1)%7)+1;
  modal(`<h2>Daily gift! 🎁</h2>${catHTML(cs(120),'happy',{cls:'bounce'})}<p><b>Day ${day}</b> in a row${day>1?' — amazing!':'. Welcome!'}</p>
   <div style="font-size:30px;letter-spacing:4px">${range(1,7).map(i=>i<=wk?'🔥':'⚪').join('')}</div>
   <p>+${y} 🪙 ${st?`<br>Day 7 bonus: <b>${st.s[2]}</b> ${st.s[1]} sticker!`:'<br><span class="tiny">Come back every day: the gift grows, and day 7 has a special sticker!</span>'}</p>
   ${napped?`<p class="nudge">🛡️ ${esc(catName())} stood guard for you yesterday and kept your streak safe!</p>`:''}
   <button class="btn big" data-act="close" style="margin-top:8px">Yay!</button>`);
  sfx.chest();confetti(40);
}

/* ---------------- name sign-in + secret code ---------------- */
function nameKey(n){return String(n||'').trim().replace(/\s+/g,' ').toLowerCase()}
function cyrb53(str,seed=7){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function pinHash(name,pin){return 'p1:'+cyrb53(nameKey(name)+'#warrior#'+pin)}
function needsSetup(){return !!S.name&&(!S.pinHash||!S.age)}
function renderSetup(){setTheme('meadow');app.classList.remove('playing');if(!S.pinHash){if(!UI.pin||UI.pin.ctx!=='setup')UI.pin={mode:'new',ctx:'setup',val:'',first:''};app.innerHTML=pinHTML();return}UI.pin=null;app.innerHTML=ageHTML('setup')}
function pinHTML(){
  const p=UI.pin,pend=UI.pending&&UI.pending.data,nm=pend?pend.name:(p.ctx==='onboard'?UI.tmpName:S.name);
  let title,sub;
  if(p.mode==='enter'){title=`Hi ${esc(nm)}! 👋`;sub='Type your secret code'}
  else if(p.mode==='confirm'){title='Type it one more time';sub='Just to make sure you remember it!'}
  else if(p.ctx==='onboard'&&pend){title=`Welcome back, ${esc(nm)}! 💖`;sub='Your game needs a secret code now. Pick 4 numbers you will remember.'}
  else if(p.ctx==='setup'){title='New! Make your secret code 🔐';sub='Pick 4 numbers you will remember. You need them to sign in to your game.'}
  else if(p.ctx==='change'){title='Pick a new secret code 🔐';sub=`This will be ${esc(nm)}'s new code.`}
  else{title='Make a secret code 🔐';sub='Pick 4 numbers you will remember. You need them to sign in.'}
  const catOpts=pend?{fur:pend.fur,equipped:Object.assign({},pend.equipped||{})}:(S.name?{}:{fur:UI.tmpFur||'ginger',equipped:{}});
  const pad=range(1,9).map(n=>`<button data-act="pinKey" data-k="${n}">${n}</button>`).join('')+'<button data-act="pinKey" data-k="del" aria-label="Delete">⌫</button><button data-act="pinKey" data-k="0">0</button><button class="blank" tabindex="-1" aria-hidden="true"></button>';
  const back=p.ctx==='onboard'?'<button class="chip" data-act="pinBack">◀ Back</button>':p.ctx==='change'?'<button class="chip" data-act="pinBack">Cancel</button>':'';
  return `<div class="onb pinscreen">${catHTML(cs(120),p.err?'wow':'normal',catOpts)}<h2 class="lbl">${title}</h2><p class="lead">${sub}</p><div class="pindots ${p.err?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<p.val.length?'on':''}"></i>`).join('')}</div>${p.err?`<p class="pinerr">${p.err}</p>`:''}<div class="keypad pinpad">${pad}</div><div class="row">${p.mode==='enter'?'<button class="chip" data-act="pinForgot">Forgot your code?</button>':''}${back}</div></div>`;
}
function ageHTML(ctx){
  const nm=ctx==='onboard'?UI.tmpName:S.name,cur=ctx==='onboard'?UI.tmpAge:S.age;
  return `<div class="onb">${ctx==='modal'?'':catHTML(cs(120),'happy',ctx==='onboard'?{fur:UI.tmpFur||'ginger',equipped:{}}:{})}<h2 class="lbl">How old are you, ${esc(nm)}?</h2><p class="lead">So I can pick the right maths for you!</p><div class="ages">${range(9,14).map(a=>`<button class="agebtn ${cur===a?'on':''}" data-act="pickAge" data-age="${a}" data-ctx="${ctx}">${a===14?'14+':a}</button>`).join('')}</div><p class="tiny">A grown-up can change this later in the ⚙️ Grown-ups corner.</p></div>`;
}
function pinKey(k){
  const p=UI.pin;if(!p||p.busy)return;
  if(p.lockUntil&&Date.now()<p.lockUntil){p.err=`Too many tries. Wait ${Math.ceil((p.lockUntil-Date.now())/1000)} seconds, then try again.`;return render()}
  if(k==='del'){p.val=p.val.slice(0,-1);p.err='';sfx.tap();return render()}
  if(p.val.length>=4)return;p.val+=k;p.err='';sfx.tap();render();
  if(p.val.length===4){p.busy=true;setTimeout(()=>{p.busy=false;pinComplete()},260)}
}
function pinComplete(){
  const p=UI.pin;if(!p)return;
  if(p.mode==='enter'){
    const pd=UI.pending.data;
    if(UI.pending.stub)return pinServerCheck(pinHash(pd.name,p.val)); // the cloud checks the code; it never sends the save to a wrong one
    if(pinHash(pd.name,p.val)===pd.pinHash){sfx.correct(3);return finishLogin(null)}
    p.tries=(p.tries||0)+1;p.val='';sfx.wrong();
    if(p.tries>=5){p.tries=0;p.lockUntil=Date.now()+30000;p.err='Too many tries. Wait 30 seconds, then try again.'}else p.err="That's not the right code. Try again!";
    return render();
  }
  if(p.mode==='new'){p.first=p.val;p.val='';p.mode='confirm';return render()}
  if(p.val!==p.first){p.mode='new';p.val='';p.first='';p.err="Those didn't match. Let's pick it again!";sfx.wrong();return render()}
  const nm=p.ctx==='onboard'?(UI.pending?UI.pending.data.name:UI.tmpName):S.name,h=pinHash(nm,p.val);sfx.chest();
  if(p.ctx==='onboard'){if(UI.pending)return UI.pending.stub?pinClaim(h):finishLogin(h);UI.tmpPinHash=h;UI.pin=null;UI.onboard='age';return render()}
  if(p.ctx==='change'&&cloudOn()&&S.pinHash)return pinChangeCloud(h);
  UI.pin=null;S.pinHash=h;save();
  if(p.ctx==='change'){UI.tab='parents';render();return toast('<span class="ti">🔐</span><div><b>New secret code saved!</b></div>')}
  toast('<span class="ti">🔐</span><div><b>Secret code saved!</b><br>Use it when you sign in.</div>');afterSetupCheck();
}
const PIN_NET="I can't reach the internet. Try again in a moment.";
async function pinServerCheck(h){ // sign in to a cloud save: the server compares the code and counts wrong tries
  const p=UI.pin;p.busy=true;render();let r;
  try{r=await cloudLoadAuth(UI.tmpName,h)}catch(e){p.busy=false;p.val='';p.err=PIN_NET;return render()}
  p.busy=false;if(UI.pin!==p)return;
  if(r.status==='ok'){UI.pending={data:r.data,at:r.saved_at};sfx.correct(3);return finishLogin(null)}
  p.val='';sfx.wrong();
  if(r.status==='locked'){p.lockUntil=Date.now()+30000;p.err='Too many tries. Wait 30 seconds, then try again.'}
  else if(r.status==='nocode'){p.mode='new';p.first='';p.err='Your game needs a secret code now. Pick 4 numbers you will remember.'}
  else if(r.status==='none'){UI.pending=null;UI.cloudBase=0;p.mode='new';p.first='';p.err='That save is gone. Pick a secret code to start fresh.'}
  else{p.tries=(p.tries||0)+1;if(p.tries>=5){p.tries=0;p.lockUntil=Date.now()+30000;p.err='Too many tries. Wait 30 seconds, then try again.'}else p.err="That's not the right code. Try again!"}
  render();
}
async function pinClaim(h){ // an old save with no code yet: the first sign-in sets it
  const p=UI.pin;p.busy=true;render();let r;
  try{r=await cloudClaim(UI.tmpName,h)}catch(e){p.busy=false;p.mode='new';p.val='';p.first='';p.err=PIN_NET;return render()}
  p.busy=false;if(UI.pin!==p)return;
  if(r.status==='ok'){UI.pending={data:r.data,at:r.saved_at};return finishLogin(h)}
  if(r.status==='none'){UI.pending=null;UI.cloudBase=0;UI.tmpPinHash=h;UI.pin=null;UI.onboard='age';return render()}
  p.mode='enter';p.val='';p.first='';sfx.wrong();
  if(r.status==='locked'){p.lockUntil=Date.now()+30000;p.err='Too many tries. Wait 30 seconds, then try again.'}else p.err='This name already has a secret code. Type it to sign in.';
  render();
}
async function pinChangeCloud(h){ // a new code is saved in the cloud first (it needs the old one), so it never half-changes
  const p=UI.pin;p.busy=true;render();let r;
  try{r=await rpcNew('wa_set_code',{p_name:cloudKey(S.name),p_pin:S.pinHash,p_new:h},async()=>({ok:true}))}

  p.busy=false;

  UI.pin=null;S.pinHash=h;save();UI.tab='parents';render();toast('<span class="ti">🔐</span><div><b>New secret code saved!</b></div>');
}

  if(UI.pin&&!$('#overlay')&&(!S.name||needsSetup()||UI.pin.ctx==='change')){if(/^[0-9]$/.test(e.key)){e.preventDefault();pinKey(e.key)}else if(e.key==='Backspace'){e.preventDefault();pinKey('del')}return}
  if(!S.name){if(e.key==='Enter'){const b=document.querySelector('[data-primary]');if(b){e.preventDefault();b.click()}}return}
  if(e.target&&e.target.id==='chAns'&&e.key==='Enter'){ACT.chCheck();return}

  if(UI.screen!=='play'||!P||$('#overlay')||$('#scratch'))return;
  if(e.key==='.'||e.key===','){press('.');return}
  if(e.key==='-'||e.key==='−'){press('-');return}
  if(/^[0-9]$/.test(e.key)){if(P.mc||(P.qs[P.i]&&P.qs[P.i].mc)){const bs=[...document.querySelectorAll('.choice')],b=bs[Number(e.key)-1];if(b&&!b.disabled)b.click()}else press(e.key)}
  else if(e.key==='Backspace'){e.preventDefault();press('del')}
  else if(e.key==='Enter'){e.preventDefault();if(P.explaining)ACT.gotit();else press('ok')}
});

/* offline play: a service worker keeps the last copy of the game (only when served over http/https; a double-clicked file:// page has none) */
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}catch(e){}

/* ---------------- anonymous play counter ----------------
   Counts launches so William can see whether the game is being played.
   Records: a random device id (not derived from anything personal), whether
   the device is new, the referring site's hostname, installed-app vs browser
   tab, and the window width. No names, no progress, no personal data.
   Entirely fire-and-forget: any failure is swallowed so play never breaks. */
const VISITOR_KEY='warriorAcademy.vid';
function visitorId(){
  try{
    let v=localStorage.getItem(VISITOR_KEY);
    if(v)return{id:v,fresh:false};
    const b=new Uint8Array(8);(crypto||{}).getRandomValues?crypto.getRandomValues(b):b.forEach((_,i)=>b[i]=Math.floor(Math.random()*256));
    v=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
    localStorage.setItem(VISITOR_KEY,v);
    return{id:v,fresh:true};
  }catch(e){return null} // private mode / storage blocked: skip counting
}
function refHost(){
  try{return document.referrer?new URL(document.referrer).hostname.slice(0,64):null}catch(e){return null}
}
function launchMode(){
  try{
    const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    return standalone?'warrior:app':'warrior:web';
  }catch(e){return null}
}
function countPlay(){
  try{
    const v=visitorId();if(!v)return;
    fetch(CLOUD.url+'wa_hit',{
      method:'POST',keepalive:true,
      headers:{apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key,'Content-Type':'application/json'},
      body:JSON.stringify({p_visitor:v.id,p_new:v.fresh,p_ref:refHost(),p_mode:launchMode(),p_w:Math.round(innerWidth)||null})
    }).catch(()=>{});
  }catch(e){}
}

(async function boot(){
  UI.realm=pickStartRealm();
  let synced=false;
  if(S.name&&needsSetup()&&S.cloud){app.innerHTML='<div class="onb"><p class="lead">Loading your game… ⚔️</p></div>';try{await Promise.race([cloudSync(),new Promise(r=>setTimeout(r,4000))]);synced=true}catch(e){}UI.realm=pickStartRealm()}
  render();if(S.name){if(!needsSetup()){setTimeout(checkDaily,500);setTimeout(()=>{if(friendsOn())friendsLoad()},1800)}if(!synced)cloudSync()}
  countPlay();
})();
