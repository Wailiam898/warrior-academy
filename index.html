<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Warrior">
<meta name="theme-color" content="#dfe9ff">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Warrior Academy — a maths quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22304a; --muted:#5f6b85; --line:#dfe6f3;
  --pink:#3b6fd8; --pink-d:#244ea8; --mint:#2fb889; --mint-d:#1f8f68; --sun:#ffc43d; --sun-d:#e09b12;
  --shadow:0 5px 0 rgba(42,54,79,.10),0 10px 24px rgba(42,54,79,.10);
  --font:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --d:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#f3f7ff}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);background-image:linear-gradient(180deg,#e4edff,#fff8ef);background-attachment:fixed;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #7cc7ff;outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:640px;margin:0 auto;padding:12px 14px 112px;min-height:100vh}
#app.playing{padding-bottom:16px}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tiny{font-size:14px;color:var(--muted)}
.sec{font-size:30px;margin:16px 4px 10px}
.sub{font-size:20px;margin:18px 4px 8px}
.card{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pink);color:#fff;font-weight:800;font-size:20px;padding:8px 22px;min-height:52px;border-radius:18px;box-shadow:0 5px 0 var(--pink-d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.sun{background:var(--sun);color:#5a3b00;box-shadow:0 5px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d4ddee}
.btn.big{font-size:24px;padding:10px 34px;min-height:60px}
.btn:disabled{opacity:.45}
.chip{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #d4ddee;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#e1ebff;box-shadow:0 3px 0 #b3ccff;color:var(--pink-d)}
.chip:disabled{opacity:.45}

/* top bar */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:2px 14px 2px 2px;box-shadow:var(--shadow)}
.me .nm{font-weight:800;font-size:17px;line-height:1}
.me .rk{font-size:12px;color:var(--muted);line-height:1.2}
.pill{background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:18px;box-shadow:var(--shadow);display:inline-flex;gap:4px;align-items:center;white-space:nowrap;min-height:40px}
.pill.pop{animation:pop .35s}
.gear{font-size:18px}

/* knight */
.cat{position:relative;display:inline-block;flex:none}
.cat svg{position:relative;z-index:1;width:100%;height:100%;display:block;overflow:visible}
.cat .acc{position:absolute;z-index:2;line-height:1;pointer-events:none}
.cat .acc.behind{z-index:0}
.petbtn{border-radius:50%}
.petbtn:active .cat{transform:scale(.94)}
.cat.bounce{animation:bounce .5s}
.cat.idle svg{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 90%}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:2px solid var(--line);z-index:20}
nav.tabs button{flex:1;max-width:116px;padding:4px 2px;border-radius:16px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;color:var(--muted)}
nav.tabs .i{font-size:27px;line-height:1.15}
nav.tabs button.on{background:#e3ecff;color:var(--pink-d)}
nav.tabs .badge{position:absolute;margin-left:28px;margin-top:-2px;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}

/* companion & map */
.companion{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.bubble{position:relative;background:#fff;border-radius:20px;padding:10px 14px;font-size:17px;font-weight:600;box-shadow:var(--shadow);line-height:1.3;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bubble.small{font-size:16px;padding:8px 12px;min-height:44px}
.rankbar{background:rgba(255,255,255,.85);border-radius:16px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.meter{flex:1;height:14px;background:#e8edf8;border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#9fbfff);border-radius:99px}
.realm-head{display:flex;align-items:center;gap:8px;margin:16px 0 2px}
.realm-head h1{font-size:28px;flex:1;text-align:center}
.arrow{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:20px;flex:none}
.arrow:disabled{opacity:.35}
.realm-dots{display:flex;justify-content:center;gap:6px;margin:6px 0}
.realm-dots button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);font-size:20px}
.realm-dots button.on{background:#fff;box-shadow:0 0 0 3px var(--pink)}
.realm-dots button.lock{filter:grayscale(1);opacity:.5}
.realm-intro{text-align:center;font-size:16px;margin:2px 12px 0;color:var(--muted)}
.realm-track{text-align:center;font-size:14px;font-weight:800;color:var(--pink-d);letter-spacing:.04em;text-transform:uppercase}
body.dark .realm-head h1, body.dark .realm-intro{color:#fff}
body.dark .realm-track{color:#ffd36b}
.path{position:relative;margin:4px auto 0}
.path svg.trail{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid #fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(42,54,79,.18);color:var(--ink)}
.node.done{background:var(--sun)}
.node.current{background:var(--pink);color:#fff;animation:pulse 1.6s infinite}
.node.locked{background:#e5e9f1;color:#aab2c2;font-size:24px}
.node.boss{width:98px;height:98px;font-size:44px}
.node.boss.locked{font-size:30px}
.node .st{position:absolute;bottom:-14px;font-size:17px;letter-spacing:-1px;color:#ffb400;text-shadow:0 2px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}
.node .lname{position:absolute;top:calc(100% + 12px);white-space:nowrap;font-size:13px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);padding:0 8px;border-radius:8px}
.you{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation:hop 1.4s ease-in-out infinite}
.lockcard{text-align:center;margin:24px 0}
.lockcard .big{font-size:64px}

/* practice */
.pcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.pcard.col{flex-direction:column;align-items:stretch}
.pcard .pi{font-size:42px;width:56px;text-align:center;flex:none}
.pcard h3{font-size:22px}
.pcard p{font-size:15px;color:var(--muted);line-height:1.3}
.pcard .grow{flex:1}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tbtn{background:#f6f9ff;border-radius:16px;box-shadow:0 3px 0 #d6dff2;padding:8px 4px;font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.tbtn small{font-size:12px;color:var(--muted);font-weight:700}
.minibar{width:80%;height:6px;background:#e6ebf6;border-radius:9px;overflow:hidden;margin-top:3px}
.minibar i{display:block;height:100%;background:var(--mint)}

/* closet */
.closet-hero{display:flex;align-items:center;gap:16px;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:14px 18px}
.catname{font-size:28px;font-weight:800}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.sw{background:#fff;border-radius:18px;padding:8px 4px;box-shadow:0 3px 0 #dce3f2;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px}
.sw .dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink)}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item .ie{font-size:42px;line-height:1.1}
.item .in{font-weight:700;font-size:15px;line-height:1.1}
.item.worn{box-shadow:0 0 0 3px var(--mint),var(--shadow)}
.item .chip{font-size:15px;min-height:40px}

/* album */
.seg{display:flex;background:#fff;border-radius:18px;padding:4px;gap:4px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:14px;font-weight:700;font-size:15px;min-height:44px}
.seg button.on{background:#e1ebff;color:var(--pink-d)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stk{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;position:relative;border:4px solid #fff}
.stk span{font-size:44px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(42,54,79,.15))}
.stk small{font-size:13px;font-weight:700;text-align:center;line-height:1.1}
.stk.r-r{border-color:#9ad8ff}
.stk.r-l{border-color:#ffd256;background:linear-gradient(180deg,#fff9e0,#fff)}
.stk.empty{background:#f1f4fa;box-shadow:none}
.stk.empty span{color:#c3ccdd;font-weight:800;filter:none}
.stk .cnt{position:absolute;top:4px;right:8px;font-size:12px;color:var(--muted)}
.stk.big{width:110px;padding:14px}
.stk.big span{font-size:64px}
.drawings{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.drawings button{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#fff;aspect-ratio:1}
.drawings img{width:100%;height:100%;object-fit:cover;display:block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px;text-align:center}
.bdg .be{font-size:36px}
.bdg b{display:block;font-size:15px}
.bdg small{font-size:12px;color:var(--muted);line-height:1.1;display:block}
.bdg.off{background:#f1f4fa;box-shadow:none;opacity:.7}
.bdg.off .be{filter:grayscale(1);opacity:.4}
.empty-note{text-align:center;color:var(--muted);padding:30px 10px;font-size:17px}

/* studio */
.challenge .chl{font-weight:800;color:var(--pink-d);font-size:15px}
.challenge .cht{font-size:20px;font-weight:700;line-height:1.25;margin:2px 0 8px}
.challenge .chq{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:17px}
.smallin{width:80px;height:44px;border-radius:14px;border:3px solid #d9e2f5;font-size:22px;font-weight:800;text-align:center;color:var(--ink)}
.ok{color:var(--mint-d)}
.studio{margin-top:14px}
#cv{width:100%;max-width:560px;aspect-ratio:1;display:block;margin:0 auto;background:#fff;border-radius:24px;box-shadow:var(--shadow);touch-action:none;cursor:crosshair}
.tools{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.colr{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.colr.on{box-shadow:0 0 0 4px var(--ink)}
.size i{display:inline-block;border-radius:50%;background:var(--ink)}

/* play */
.play{display:flex;flex-direction:column;gap:10px}
.play-top{display:flex;gap:10px;align-items:center}
.xbtn{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px;font-weight:800;flex:none}
.prog{flex:1;height:22px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#3ccfa5,#9be8a8);border-radius:999px;transition:width .45s}
.timer{height:14px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9a5a,var(--sun))}
.coach{display:flex;align-items:center;gap:8px}
.combo{font-weight:800;font-size:18px;color:#ff7a1a;background:#fff;border-radius:999px;padding:4px 12px;box-shadow:var(--shadow);opacity:0;transform:scale(.6);transition:all .25s;white-space:nowrap}
.combo.on{opacity:1;transform:scale(1)}
.combo.bump{animation:pop .35s}
.qcard{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:14px 14px 16px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.qlabel{font-size:14px;font-weight:700;color:var(--muted)}
.tag{background:#e3f8ef;color:var(--mint-d);border-radius:99px;padding:0 8px;margin-left:4px}
.word{font-size:21px;font-weight:600;line-height:1.3}
.qtext{font-size:clamp(42px,11vw,62px);font-weight:800;line-height:1.05;white-space:nowrap}
.wordans{font-size:30px}
.qtext.long{font-size:clamp(26px,7.5vw,40px);white-space:normal;line-height:1.25}
.grps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
.g1{border:3px dashed #d3ddf0;border-radius:16px;padding:4px 6px;font-size:20px;line-height:1.1;max-width:120px;word-break:break-all;background:#fafcff}
.area{display:flex;width:min(320px,90%);height:74px;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.ar{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#e1ebff;font-size:17px;min-width:84px;line-height:1.15}
.ar.o{background:#d9f6ea;border-left:3px solid var(--ink)}
.ar span{font-size:20px;font-weight:800;color:var(--mint-d)}
.crystals{background:rgba(255,255,255,.88);border-radius:16px;padding:8px 10px;margin-top:8px}
.crhead{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:4px}
.crhead span{color:var(--muted);font-size:13px}
.gems{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.gem{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;padding:4px 0 2px;border-radius:10px;min-height:46px;color:var(--ink)}
.gem span{font-size:21px;line-height:1.1;filter:grayscale(1) opacity(.3)}
.gem.l1 span{filter:grayscale(.6) opacity(.6)}
.gem.l2 span{filter:none}
.gem.l3{background:#e7f4ff;box-shadow:0 0 0 2px #9fd6ff}
.gem.l3 span{filter:drop-shadow(0 0 5px #48b4ff);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.bonus-tag{display:inline-block;background:#fff3c4;color:#8a6200;border-radius:99px;padding:0 8px;font-size:12px;margin-left:4px}
.ans{display:inline-block;min-width:1.5em;padding:0 .18em;border-radius:16px;background:#f0f5ff;color:var(--pink-d);border:3px dashed #b7cfff}
.ans.reveal{background:#e3f8ef;border-color:#9fe3c8;color:var(--mint-d)}
.ans.right{background:#e3f8ef;border:3px solid var(--mint);color:var(--mint-d)}
.helpers{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:58px;font-size:30px;font-weight:800;background:#fff;border-radius:18px;box-shadow:0 5px 0 #d4ddee}
.keypad button:active{transform:translateY(4px);box-shadow:0 1px 0 #d4ddee}
.keypad .ok{background:var(--mint);color:#fff;box-shadow:0 5px 0 var(--mint-d)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{height:78px;font-size:38px;font-weight:800;background:#fff;border-radius:22px;box-shadow:0 6px 0 #d4ddee}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #d4ddee}
.choice.wrongc{opacity:.35;text-decoration:line-through}
.hint,.explain{background:#fff8e6;border-radius:18px;padding:10px 12px;font-size:18px;line-height:1.35;font-weight:600}
.explain{background:#eefaf5}
.exhead{font-weight:800;color:var(--mint-d)}
.exeq{font-size:34px;font-weight:800}
.explain .btn{margin-top:8px}
.bossbar{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:22px;padding:8px 14px;box-shadow:var(--shadow)}
.gface{font-size:52px;line-height:1;transition:transform .2s}
.gface.hit{animation:wiggle .5s}
.gname{font-weight:800;font-size:17px}
.joy{height:14px;background:#e8edf8;border-radius:99px;overflow:hidden;margin:3px 0}
.joy i{display:block;height:100%;background:linear-gradient(90deg,#9fbfff,var(--sun));transition:width .4s}
.garden-row{text-align:center;font-size:26px;letter-spacing:2px;background:rgba(255,255,255,.85);border-radius:18px;padding:4px}

/* visuals */
.vis{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
.arr{display:inline-flex;flex-direction:column;gap:3px;line-height:1}
.arr div{white-space:nowrap}
.dots{display:inline-grid;gap:3px}
.dots i{width:var(--d);height:var(--d);border-radius:50%;background:var(--pink)}
.dots i.b{background:var(--mint)}
.tfwrap{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tf{display:grid;grid-template-columns:repeat(5,22px);gap:4px;padding:6px;border:3px solid #dce4f3;border-radius:12px}
.tf i{width:22px;height:22px;border-radius:50%;background:#eef1f8}
.tf i.a{background:var(--pink)}
.tf i.b{background:var(--mint)}
.cap{font-size:15px;color:var(--muted);font-weight:700}
.ca{color:var(--pink-d)} .cb{color:var(--mint-d)}
.b10{display:inline-flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.grp{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap;max-width:200px}
.rod{width:11px;height:66px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--c) 0 5.6px,rgba(255,255,255,.7) 5.6px 6.6px)}
.cube{width:11px;height:11px;border-radius:2px;background:var(--c)}
.ga{--c:var(--pink)} .gb{--c:var(--mint)}
.plus{font-size:26px;font-weight:800;align-self:center}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(42,54,79,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:30px;padding:22px 18px;max-width:440px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popin .35s cubic-bezier(.3,1.5,.6,1)}
.modal h2{font-size:28px;margin-bottom:6px}
.modal p{font-size:17px;line-height:1.35;margin:6px 0}
.stars3{display:flex;justify-content:center;gap:6px;margin:6px 0}
.bigstar{font-size:62px;color:#dfe6f3;line-height:1;transition:color .2s}
.bigstar:nth-child(2){font-size:76px;margin-top:-10px}

/* parents */

/* fx */
.p{position:fixed;pointer-events:none;z-index:90;font-size:24px;animation:fly .9s ease-out forwards}

/* knight moves */
.cat{transform-origin:50% 62%}

/* ---- v4: rigged cartoon knight (parts animate independently) ---- */
.kitty *{transform-box:view-box}
.kitty .k-tail{transform-origin:150px 160px}
.kitty .k-head{transform-origin:100px 140px}
.kitty .k-earL{transform-origin:70px 62px}.kitty .k-earR{transform-origin:130px 62px}
.kitty .k-eyeL{transform-origin:76px 85px}.kitty .k-eyeR{transform-origin:124px 85px}
.kitty .k-hL{transform-origin:76px 85px}.kitty .k-hR{transform-origin:124px 85px}
.kitty .k-armL{transform-origin:60px 142px}.kitty .k-armR{transform-origin:140px 142px}
.kitty .k-legL{transform-origin:80px 186px}.kitty .k-legR{transform-origin:120px 186px}
.kitty .m-open{transform-origin:100px 106px}.kitty .k-all{transform-origin:100px 196px}
.kitty .e-happy,.kitty .e-sleepy,.kitty .e-heart,.kitty .k-brows,.kitty .m-grin,.kitty .m-open,.kitty .m-sad,.kitty .k-thumb{display:none}
.md-happy .e-open{display:none}.md-happy .e-happy{display:inline}.md-happy .m-smile{display:none}.md-happy .m-grin{display:inline}
.md-sleepy .e-open{display:none}.md-sleepy .e-sleepy{display:inline}
.md-wow .m-smile{display:none}.md-wow .m-open{display:inline}
.md-oops .k-brows{display:inline}.md-oops .m-smile{display:none}.md-oops .m-sad{display:inline}
.md-think .k-brows{display:inline}
/* always-on life: blink, tail swish, ear twitch, glance around, gentle head bob */
.kitty .k-eyeL,.kitty .k-eyeR{animation:kBlink 4.6s infinite;animation-delay:var(--bd,0s)}
.kitty .k-tail{animation:kTail 2.6s ease-in-out infinite alternate;animation-delay:calc(var(--bd,0s) * -1)}
.kitty .k-earR{animation:kEarR 6.5s infinite;animation-delay:var(--bd,0s)}
.kitty .k-earL{animation:kEarL 8.3s infinite;animation-delay:calc(var(--bd,0s) + 1.7s)}
.kitty .e-open{animation:kLook 9s ease-in-out infinite;animation-delay:calc(var(--bd,0s) * -2)}
.kitty .k-head{animation:kHead 4.8s ease-in-out infinite;animation-delay:calc(var(--bd,0s) * -1)}
.md-happy .k-tail{animation:kWag .45s ease-in-out infinite alternate}
.md-oops .k-earL{animation:none;transform:rotate(-20deg)}.md-oops .k-earR{animation:none;transform:rotate(20deg)}.md-oops .k-tail{animation:none;transform:rotate(18deg)}
.md-think .k-armR{transform:rotate(-150deg)}.md-think .e-open{animation:none;transform:translate(3px,-4px)}.md-think .k-head{animation:none;transform:rotate(-6deg)}
.md-wow .k-earL{animation:none;transform:rotate(8deg)}.md-wow .k-earR{animation:none;transform:rotate(-8deg)}
/* any move: happy face */
.cat.moving .e-open,.cat.moving .e-sleepy,.cat.moving .k-brows,.cat.moving .m-smile,.cat.moving .m-sad,.cat.moving .m-open{display:none}
.cat.moving .e-happy,.cat.moving .m-grin{display:inline}
.cat.mv-hearts .e-happy{display:none}.cat.mv-hearts .e-heart{display:inline}
.cat.mv-sing .m-grin{display:none}.cat.mv-sing .m-open{display:inline}
.cat.mv-thumbs .k-thumb{display:inline}
.cat.moving .k-tail{animation:kWag .3s ease-in-out infinite alternate}
.cat.moving .k-armR,.cat.moving .k-armL,.cat.moving .k-legL,.cat.moving .k-legR,.cat.moving .k-head{transform:none}
/* move choreography */
.cat.mv-hop .k-armL{animation:aUpL .6s ease-out}.cat.mv-hop .k-armR{animation:aUpR .6s ease-out}
.cat.mv-wave .k-armR{animation:aWave 1.5s ease-in-out}.cat.mv-wave .k-head{animation:hTiltR 1.5s ease-in-out}
.cat.mv-thumbs .k-armR{animation:aThumb 1.4s cubic-bezier(.3,1.4,.5,1)}.cat.mv-thumbs .k-head{animation:hNod 1.4s ease-in-out}
.cat.mv-jump .k-armL{animation:aUpL 1s ease-out}.cat.mv-jump .k-armR{animation:aUpR 1s ease-out}.cat.mv-jump .k-legL,.cat.mv-jump .k-legR{animation:lDangle 1s ease-out}
.cat.mv-wiggle .k-earL{animation:eFlopL .5s ease-in-out 2}.cat.mv-wiggle .k-earR{animation:eFlopR .5s ease-in-out 2}.cat.mv-wiggle .k-armL{animation:aFlapL .25s ease-in-out 4}.cat.mv-wiggle .k-armR{animation:aFlapR .25s ease-in-out 4}
.cat.mv-dance .k-armL{animation:aDanceL 2s ease-in-out}.cat.mv-dance .k-armR{animation:aDanceR 2s ease-in-out}.cat.mv-dance .k-legL{animation:lStepA .5s ease-in-out 4}.cat.mv-dance .k-legR{animation:lStepB .5s ease-in-out 4}.cat.mv-dance .k-head{animation:hBop .5s ease-in-out 4}
.cat.mv-spin .k-armL{animation:aOutL 1.2s ease-in-out}.cat.mv-spin .k-armR{animation:aOutR 1.2s ease-in-out}
.cat.mv-sing .m-open{animation:mSing .28s ease-in-out 6}.cat.mv-sing .k-armL{animation:aMicL 1.7s ease-in-out}.cat.mv-sing .k-armR{animation:aOutR 1.7s ease-in-out}.cat.mv-sing .k-head{animation:hSway .85s ease-in-out 2}
.cat.mv-hearts .k-hL,.cat.mv-hearts .k-hR{animation:hPulse .36s ease-in-out 4}.cat.mv-hearts .k-armL{animation:aHugL 1.45s ease-in-out}.cat.mv-hearts .k-armR{animation:aHugR 1.45s ease-in-out}
.cat.mv-moonwalk .k-legL{animation:lSlideA .5s linear 4}.cat.mv-moonwalk .k-legR{animation:lSlideB .5s linear 4}.cat.mv-moonwalk .k-armL{animation:aSwingL .5s ease-in-out 4}.cat.mv-moonwalk .k-armR{animation:aSwingR .5s ease-in-out 4}.cat.mv-moonwalk .k-head{animation:hBop .5s ease-in-out 4}
.cat.mv-cartwheel .k-armL{animation:aCartL 1.6s ease-in-out}.cat.mv-cartwheel .k-armR{animation:aCartR 1.6s ease-in-out}.cat.mv-cartwheel .k-legL{animation:lSplitL 1.6s ease-in-out}.cat.mv-cartwheel .k-legR{animation:lSplitR 1.6s ease-in-out}
.cat.mv-backflip .k-armL{animation:aFlipL 1.25s ease-in-out}.cat.mv-backflip .k-armR{animation:aFlipR 1.25s ease-in-out}.cat.mv-backflip .k-legL,.cat.mv-backflip .k-legR{animation:lTuck 1.25s ease-in-out}
.cat.mv-superstar .k-armL{animation:aStarL 1.4s ease-in-out}.cat.mv-superstar .k-armR{animation:aStarR 1.4s ease-in-out}.cat.mv-superstar .k-legL{animation:lSplitL 1.4s ease-in-out}.cat.mv-superstar .k-legR{animation:lSplitR 1.4s ease-in-out}
@keyframes kBlink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes kTail{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
@keyframes kWag{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes kEarR{0%,84%,100%{transform:rotate(0)}87%{transform:rotate(-12deg)}90%{transform:rotate(4deg)}93%{transform:rotate(-6deg)}}
@keyframes kEarL{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(12deg)}94%{transform:rotate(-3deg)}}

/* accessories inside the knight drawing */
.cat .acc2{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;pointer-events:none}
.wintag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--sun,#ffc43d);color:#2a364f;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;white-space:nowrap}
.item{position:relative}
/* bonus game card + banner */
.bonuscard{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);border-radius:18px;padding:8px 12px;margin-top:8px;box-shadow:var(--shadow);cursor:pointer}
.bonuscard .bi{font-size:30px}
.bonuscard.ready{background:linear-gradient(90deg,#fff3c4,#e0eaff);animation:readyGlow 2s ease-in-out infinite}
.bonuscard .meter{height:10px;margin:4px 0 2px}
@keyframes readyGlow{50%{box-shadow:0 0 0 4px #ffc43d}}
.passban{margin-top:10px;background:#fff3c4;border-radius:16px;padding:8px 10px;font-size:15px}
/* Treat Tumble */
#tumble{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#8fd3ff 0%,#dff3ff 70%,#bff0c8 100%);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;display:flex;flex-direction:column}
.tb-sky{position:absolute;inset:0;pointer-events:none}
.tb-cl{position:absolute;left:-20%;font-size:70px;opacity:.85;animation:tbCloud linear infinite}
@keyframes tbCloud{to{transform:translateX(140vw)}}
.tb-hud{position:relative;z-index:3;display:flex;gap:8px;align-items:center;padding:10px 12px 4px}
.tb-hud .xbtn{margin-left:auto}
.tb-mult{opacity:0;transition:opacity .2s}.tb-mult.on{opacity:1;background:#ffe08a}
.tb-timer{position:relative;z-index:3;height:10px;margin:0 12px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
.tb-timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8fb4ff,#ffc43d)}
.tb-field{position:relative;flex:1;overflow:hidden}
.tb-grass{position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,#7ed67a,#52b55a);border-top:4px solid #9ce58f}
.tb-cat{position:absolute;left:0;bottom:12px;z-index:2;transform-origin:50% 100%;will-change:transform}
.tb-cat.hurt{animation:tbBlink .2s steps(2) infinite}
@keyframes tbBlink{50%{opacity:.35}}
.tb-item{position:absolute;left:0;top:0;line-height:1;will-change:transform;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.tb-item.bad{filter:drop-shadow(0 0 6px rgba(255,60,60,.65))}
.tb-pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:24px;color:#4a7ad9;pointer-events:none;animation:tbPop .9s ease-out forwards;z-index:4;white-space:nowrap;text-shadow:0 2px 0 #fff}
.tb-pop.goldpop{color:#c48a00;font-size:32px}.tb-pop.badpop{color:#3b7a2f}.tb-pop.powpop{font-size:30px;color:#3f70d1}
@keyframes tbPop{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
.tb-msg{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}
.tb-msg>*{pointer-events:auto}
.tb-card{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:18px 20px;max-width:min(92vw,440px);text-align:center}
.tb-how{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tb-how div{background:#f2f5fb;border-radius:14px;padding:6px;font-weight:700;font-size:14px}
.tb-how b{display:block;font-size:26px;letter-spacing:2px}
.tb-count{font-size:120px;font-weight:900;color:#fff;text-shadow:0 6px 0 #4a7ad9;animation:bounce .6s}
.tb-final{font-size:64px;font-weight:900;line-height:1}
/* map scenery */
.scene{position:relative;height:clamp(140px,34vw,210px);border-radius:24px;overflow:hidden;margin:10px 0 6px;box-shadow:var(--shadow)}
.scene.locked{filter:grayscale(.75) brightness(.9)}
.sc-ground{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%}
.sc-d{position:absolute;font-size:clamp(24px,6vw,40px);line-height:1;pointer-events:none}
.sc-lm{position:absolute;right:9%;bottom:20%;font-size:clamp(64px,17vw,112px);line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2));animation-duration:4.5s}
.sc-guard{position:absolute;left:8%;bottom:12%;font-size:clamp(40px,10vw,64px);line-height:1;z-index:1;animation-duration:2.6s}
.sc-happy{position:absolute;right:-.4em;top:-.3em;font-size:.45em}
.sc-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px}
.sc-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 4px #fff;animation:scTw 2.4s ease-in-out infinite}
.pdec{transform:translate(-50%,-50%);opacity:.95;z-index:0}
.path .node{z-index:1}
.sc-drift{animation:scDrift 9s ease-in-out infinite alternate}
.sc-bob{animation:scBob 3.2s ease-in-out infinite}
.sc-tw{animation:scTw 2.6s ease-in-out infinite}
.sc-sway{animation:scSway 3.6s ease-in-out infinite;transform-origin:50% 100%}
.sc-fly{animation:scFly 6s ease-in-out infinite}
.sc-fall{animation:scFall 5s ease-in-out infinite}
.pdec.sc-drift,.pdec.sc-bob,.pdec.sc-tw,.pdec.sc-sway,.pdec.sc-fly,.pdec.sc-fall{animation-name:none}
.pdec{animation:pdBob 3.4s ease-in-out infinite}
@keyframes scDrift{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
@keyframes scBob{50%{transform:translateY(-7px)}}
@keyframes scTw{50%{transform:scale(1.2);opacity:.55}}
@keyframes scSway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes scFly{0%,100%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(14px,-10px) rotate(6deg)}50%{transform:translate(26px,2px)}75%{transform:translate(10px,10px) rotate(4deg)}}
@keyframes scFall{0%{transform:translateY(-8px);opacity:.3}50%{opacity:1}100%{transform:translateY(22px);opacity:.3}}
@keyframes pdBob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 6px)) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.sc-d,.sc-lm,.sc-guard,.sc-star,.pdec,.tb-cl,.bonuscard.ready{animation:none!important}}

/* Little Paws: tap-to-count, look-first pause, count-with-me */
.tc{cursor:pointer;-webkit-tap-highlight-color:transparent}
.counted{position:relative}
.pe.counted,.cgrid span.counted{transform:scale(1.12);filter:drop-shadow(0 0 4px #ffc43d)}
.counted::before{content:attr(data-n);position:absolute;top:-.6em;right:-.4em;min-width:1.35em;height:1.35em;padding:0 .2em;border-radius:99px;background:#ffc43d;color:#2a364f;font:800 14px/1.35em system-ui,sans-serif;text-align:center;font-style:normal;z-index:2;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.tf i.counted{box-shadow:0 0 0 3px #ffc43d}
.tf i.counted::before{top:-.75em;right:-.55em;font-size:12px}
.tf.counted{box-shadow:0 0 0 4px #ffc43d}
.tf.counted::before{font-size:16px}
.g1.counted{border-color:#ffc43d;border-style:solid;background:#fff8dc}
.g1.counted::before{font-size:17px;top:-.75em}
.g1 .gl{display:block;font-size:15px;font-weight:800;color:var(--pink-d);line-height:1.2;word-break:normal}
.thinkbar{position:relative;height:30px;border-radius:99px;background:#eef1f8;overflow:hidden;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
.thinkbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ffe08a,#ffc43d);animation:thinkfill linear forwards}
.thinkbar span{position:relative;font-weight:800;font-size:16px}
@keyframes thinkfill{to{width:100%}}
.choices.waiting .choice,#answers.guiding .choice{opacity:.45}
.chip.bigspeak{font-size:20px;padding:8px 18px;background:#fff3c4}
/* decimals */
.dbars{display:flex;flex-direction:column;gap:6px;align-items:center}
.dbar{display:grid;grid-template-columns:repeat(10,26px);border:3px solid #2a364f;border-radius:8px;overflow:hidden;background:#2a364f;gap:2px}
.dbar i{height:30px;background:#fff}
.dbar i.on{background:var(--pink)}
.dbar i.on2{background:var(--mint)}
.dbar i.x{background:#d0e0ff;position:relative}
.dbar i.x::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4a7ad9;font-weight:900;font-size:15px}
.dgrid{--g:15px;display:grid;grid-template-rows:repeat(10,var(--g));grid-auto-flow:column;grid-auto-columns:var(--g);gap:1px;border:3px solid #2a364f;background:#2a364f}

  q.word=pick([`${c} rides ${a} miles to the castle, then ${b} more miles to the tower. How many miles is that?`,
    `There are ${a} knights in the great hall. ${b} more march in! How many knights are there now?`,
    `You have ${a} gold coins and find ${b} more in a chest. How many coins do you have now?`,
    `${a} archers are on the wall and ${b} archers are at the gate. How many archers altogether?`,
    `A dragon breathes fire ${a} times, then ${b} more times. How many fiery breaths altogether?`]);
  return q;
}
function wordMulQ(tables){
  const q=mulQ(pick(tables),rnd(2,10));const {a,b}=q,c=catName(),n=S.name||'You';
  q.word=pick([`${c} sets out ${a} tables with ${b} pies on each. How many pies is that?`,
    `At the tournament there are ${a} rows with ${b} knights in each row. How many knights?`,
    `${a} knights each carry ${b} arrows. How many arrows altogether?`,
    `A spell book has ${a} pages with ${b} spells on every page. How many spells?`,
    `${n} draws ${a} castles with ${b} towers on each one. How many towers were drawn?`]);

}

/* ---- subtraction ---- */
const SUB_THEMES=[['🐴','horses','gallop away'],['🦇','bats','fly away'],['🪙','coins','roll away'],['🍎','apples','get eaten'],['🐓','chickens','run off'],['🍄','mushrooms','get picked']];
function subQ(a,b){return{op:'−',a,b,ans:a-b,res:a-b,text:`${a} − ${b}`,key:(a<=20&&b<=10)?'s'+a+'_'+b:null}}
function picSubQ(max,bs){const a=rnd(2,max),b=bs?pick(bs):rnd(1,a-1),[e,t,v]=pick(SUB_THEMES),q=subQ(a,b);q.kind='picsub';q.emo=e;q.thing=t;q.verb=v;q.small=true;q.say=`${a} ${t}. ${b} ${v}. How many are left?`;return q}
function hideQ(t){const v=rnd(1,t-1),q=missingAddQ(v,t);q.kind='hide';q.emo='🐰';q.small=true;q.say=`${t} bunnies live in the burrow. ${v} are outside. How many are hiding inside?`;return q}
function subMissQ(max){const a=rnd(6,max),b=rnd(1,Math.min(10,a-1)),c=a-b;return{op:'−',a,b,ans:b,res:c,missing:true,text:`${a} − ? = ${c}`,mtext:`${a} − □ = ${c}`,key:(a<=20&&b<=10)?'s'+a+'_'+b:null}}
function familyQ(){const x=rnd(2,9),b=rnd(2,9),t=x+b;return{op:'−',kind:'family',a:t,b,ans:x,res:x,text:`${x} + ${b} = ${t}, so ${t} − ${b}`,disp:`${x} + ${b} = ${t}<br>so ${t} − ${b} = □`,long:true,key:(t<=20&&b<=10)?'s'+t+'_'+b:null}}

function wordSubQ(big){
  const q=big?pick([G.d2d2s,G.d2d2sr])():G.sub20();const {a,b}=q,c=catName();
  q.word=pick([`${c} had ${a} apples and fed ${b} to the horses. How many apples are left?`,
    `There were ${a} knights on the bridge. ${b} rode home. How many knights are still there?`,
    `A spell book has ${a} pages. ${c} has read ${b} of them. How many pages are left?`,
    `${a} arrows were in the quiver, but ${b} were shot at the target! How many arrows are left?`,
    `${c} has ${a} gold coins and spends ${b} at the market. How many coins are left?`,
    `${c} has ${a} shields. A friend has ${b}. How many more does ${c} have?`]);
  return q;
}
/* ---- division ---- */
function divQ(t,m){return{op:'÷',a:t*m,b:t,ans:m,res:m,text:`${t*m} ÷ ${t}`,key:(t<=12&&m<=12)?'d'+t+'_'+m:null}}
function shareMk(k,m){const [e,t]=pick(THINGS),q=divQ(k,m);q.kind='share';q.emo=e;q.thing=t;q.small=k*m<=20;if(band()==='little'){q.disp='Each knight gets □';q.long=true}q.ldisp=`${k*m} ${e} → ${'🛡️'.repeat(k)}<br>🛡️ = □`;q.say=`Share ${k*m} ${t} fairly between ${k} knights. How many does each knight get?`;return q}
function shareQ(kmin,kmax,mmax){return shareMk(rnd(kmin,kmax),rnd(1,mmax))}
function halfQ(max){const m=rnd(1,Math.floor(max/2)),[e,t]=pick(THINGS),q=divQ(2,m);q.kind='half';q.emo=e;q.thing=t;q.small=true;q.text=`Half of ${2*m}`;q.disp=`Half of ${2*m} = □`;q.ldisp=`${2*m} ${e} → 🛡️🛡️<br>🛡️ = □`;q.long=true;q.say=`What is half of ${2*m}?`;return q}
function groupQ(bs,mmax){const b=pick(bs),m=rnd(2,mmax),[e,t]=pick(THINGS),q=divQ(b,m);q.kind='grouping';q.emo=e;q.thing=t;q.ldisp=`${b} ${e} = 1 👜<br>👜 = □`;q.long=true;q.say=`${b*m} ${t}. Put ${b} in each bag. How many bags do you need?`;return q}
function divFlipQ(ts){const t=pick(ts),m=rnd(2,10),q=divQ(t,m);q.kind='divflip';q.text=`${t} × ${m} = ${t*m}, so ${t*m} ÷ ${t}`;q.disp=`${t} × ${m} = ${t*m}<br>so ${t*m} ÷ ${t} = □`;q.long=true;return q}
function divMissQ(ts){const t=pick(ts),m=rnd(2,10);return{op:'÷',a:t*m,b:t,ans:t,res:m,missing:true,text:`${t*m} ÷ ? = ${m}`,mtext:`${t*m} ÷ □ = ${m}`,key:'d'+t+'_'+m}}
function remQ(bs){const b=pick(bs),full=rnd(1,9),r=rnd(1,b-1),n=b*full+r,[e,t]=pick(THINGS),askFull=Math.random()<.35;
  return{op:'÷',kind:'rem',a:n,b,full,r,ans:askFull?full:r,askFull,emo:e,thing:t,long:true,key:null,
    text:`${n} ${t} in bags of ${b}. ${askFull?'How many full bags?':'How many left over?'}`,
    disp:`${n} ${t} go into bags of ${b}.<br>${askFull?'How many full bags? □':'How many are left over? □'}`}}

function wordDivQ(ts){
  const t=pick(ts),m=rnd(2,10),q=divQ(t,m),n=t*m,c=catName();
  q.word=pick([`${n} gold coins are shared equally between ${t} knights. How many does each knight get?`,
    `${n} arrows go into quivers of ${t}. How many quivers are needed?`,
    `${c} has ${n} gems and puts ${t} in each pouch. How many pouches is that?`,
    `${t} archers share ${n} arrows fairly. How many does each archer get?`,
    `There are ${n} seats at the tournament, in rows of ${t}. How many rows are there?`]);
  return q;
}
/* ---- two-step problems mixing operations ---- */
function twoStepQ(){
  const c=catName(),T=[
   ()=>{const a=rnd(2,6),b=rnd(2,6),e=rnd(1,a*b-1);return{w:`${c} has ${a} quivers with ${b} arrows in each. ${c} shoots ${e} of them. How many arrows are left?`,ans:a*b-e,h:`First find how many arrows: ${a} × ${b}. Then take away ${e}.`,eq:`${a} × ${b} = ${a*b}, then ${a*b} − ${e} = ${a*b-e}`}},
   ()=>{const a=rnd(2,5),b=rnd(3,10),e=rnd(2,15);return{w:`You buy ${a} bags of ${b} apples. You already had ${e}. How many apples do you have now?`,ans:a*b+e,h:`First: ${a} × ${b} apples in the bags. Then add the ${e} you had.`,eq:`${a} × ${b} = ${a*b}, then ${a*b} + ${e} = ${a*b+e}`}},
   ()=>{const k=rnd(2,5),m=rnd(2,6),n=k*m,x=rnd(1,n-1);return{w:`${c} finds ${x} coins and a friend finds ${n-x}. They share them equally between ${k} knights. How many does each knight get?`,ans:m,h:`First add the coins: ${x} + ${n-x}. Then share between ${k}.`,eq:`${x} + ${n-x} = ${n}, then ${n} ÷ ${k} = ${m}`}},
   ()=>{const a=rnd(2,5),b=rnd(2,9),sv=a*b+rnd(1,30);return{w:`You have ${sv} gold. You buy ${a} helmets that cost ${b} gold each. How much gold is left?`,ans:sv-a*b,h:`First find the cost: ${a} × ${b}. Then take it away from ${sv}.`,eq:`${a} × ${b} = ${a*b}, then ${sv} − ${a*b} = ${sv-a*b}`}},
   ()=>{const r=rnd(3,8),k=rnd(3,9),e=rnd(1,r*k-1);return{w:`The tournament has ${r} rows of ${k} seats. ${e} seats are empty. How many people are sitting down?`,ans:r*k-e,h:`First find all the seats: ${r} × ${k}. Then take away the ${e} empty ones.`,eq:`${r} × ${k} = ${r*k}, then ${r*k} − ${e} = ${r*k-e}`}},
   ()=>{const k=rnd(2,6),m=rnd(2,8),g=rnd(2,9);return{w:`${k*m} pies are shared between ${k} knights. Then each knight gets ${g} more. How many pies does each knight have now?`,ans:m+g,h:`First share: ${k*m} ÷ ${k}. Then add ${g}.`,eq:`${k*m} ÷ ${k} = ${m}, then ${m} + ${g} = ${m+g}`}}];
  const t=pick(T)();return{op:'two',kind:'two',ans:t.ans,word:t.w,text:t.w,h:t.h,eq:t.eq,key:null};
}

const ALL=range(2,12);

/* ---- little paws (ages 4–6): pictures first, then numbers, then symbols ----
   Equal groups are written as repeated adding (5 + 5 + 5) because that is the sign they already know. */
const GROUPS_L=[['🐟','fish','bowl'],['🍓','strawberries','basket'],['⭐','stars','cloud'],['🐥','chicks','nest'],['🍪','cookies','plate'],['🌸','flowers','pot'],['🍯','honey pots','shelf']];
const TWOS={2:'twos',5:'fives',10:'tens'};
function lgroupsQ(g,n){const [e,t,box]=pick(GROUPS_L),q=mulQ(g,n);
  return Object.assign(q,{a:g,b:n,kind:'lgroups',emo:e,thing:t,small:g*n<=20,long:true,text:`${g} × ${n}`,
    ldisp:(g===1?`${n}`:Array(g).fill(n).join(' + '))+' = □',
    say:g===1?`One ${box} with ${n} ${t}. How many ${t}?`:`${g} ${box}s, with ${n} ${t} in each ${box}. How many ${t} altogether?`})}
function lskipQ(t){const k=rnd(3,t===2?6:5),[e,th]=pick(THINGS),seq=range(1,k-1).map(i=>i*t),q=mulQ(k,t);
  return Object.assign(q,{a:k,b:t,kind:'lskip',emo:e,thing:th,small:k*t<=20,long:true,text:`${seq.join(', ')}, ?`,ldisp:`${seq.join(', ')}, □`,
    say:`Count in ${TWOS[t]||t+'s'}. ${seq.join(', ')}, and what comes next?`})}
function tenPlusQ(){const n=rnd(1,9),q=addQ(10,n);return Object.assign(q,{a:10,b:n,text:`10 + ${n}`,kind:'tenplus',small:true,key:fk('a',10,n),say:`Ten, and ${n} more. How many is that?`})}
Object.assign(G,{
  lgroups:(ns,gmin,gmax)=>()=>lgroupsQ(rnd(gmin,gmax),pick(ns)),
  lskip:ts=>()=>lskipQ(pick(ts)),
  tenPlus:()=>tenPlusQ()
});
/* A remembered fact, reshaped so a non-reader can still solve it (null = too big for Little Paws) */
function littleFact(k){const [a,b]=k.slice(1).split('_').map(Number);
  if(k[0]==='a')return a+b>20?null:a+b<=10?picify(addQ(a,b)):addQ(a,b);
  if(k[0]==='s')return a<=20?subQ(a,b):null;
  if(k[0]==='m')return a<=5&&(b<=5||b===10)?lgroupsQ(a,b):b<=5&&a===10?lgroupsQ(b,a):null;
  if(k[0]==='d')return a*b<=20?shareMk(a,b):null;
  return null}

/* ---- decimals (ages 9–10): tenths, hundredths, money, ×10 ÷10 ---- */
const r3=x=>Math.round(x*1000)/1000;
const same=(a,b)=>Math.abs(a-b)<1e-9;
const fd=x=>String(r3(x));
const fm=x=>'$'+r3(x).toFixed(2);
const fr=(n,d)=>`<span class="frac"><b>${n}</b><i>/</i><b>${d}</b></span>`;
function dOpts(ans,ds,n=4){const out=[ans];for(const v of shuffle(ds.map(r3))){if(out.length>=n)break;if(v>=0&&!out.some(x=>same(x,v)))out.push(v)}for(let k=1;out.length<n;k++){const v=r3(ans+k/10);if(!out.some(x=>same(x,v)))out.push(v)}return out}
function dq(o){o.ans=r3(o.ans);if(o.opts)o.opts=dOpts(o.ans,o.opts,o.two?2:4);
  return Object.assign({op:'dec',dec:true,key:null,long:true,html:true,text:String(o.word||o.disp||'').replace(/<br>/g,' ').replace(/<[^>]+>/g,'')},o)}
function dShadeQ(){const k=rnd(1,9);return dq({kind:'dbar',n:k,ans:k/10,mc:true,opts:[k,k/100,1+k/10,(10-k)/10],
  disp:'Shaded part = □',say:'This bar is cut into 10 equal parts. What decimal is shaded?',
  h:'There are 10 equal parts, so each part is one tenth (0.1). Count the shaded parts.',
  ex:`${k} out of 10 parts are shaded. ${k} tenths is written 0.${k}.`,eqs:`${fr(k,10)} = 0.${k}`})}
function dFracQ(){const k=rnd(1,9);
  if(Math.random()<.5)return dq({kind:'dbar',n:k,ans:k/10,novis:true,disp:`${fr(k,10)} = □`,say:`Write ${k} tenths as a decimal.`,
    h:'Tenths live in the first place after the decimal point: 0.?',ex:`${k} tenths = 0.${k}. The ${k} sits in the tenths place.`,eqs:`${fr(k,10)} = 0.${k}`});
  return dq({kind:'dbar',n:k,ans:k,novis:true,disp:`0.${k} = □ tenths`,say:`zero point ${k}. How many tenths is that?`,
    h:'The digit straight after the decimal point tells you how many tenths.',ex:`0.${k} means ${k} tenths.`,eqs:`0.${k} = ${fr(k,10)}`})}
function dLineQ(){const k=rnd(1,9),lo=Math.random()<.35?rnd(1,2):0,v=lo+k/10;
  return dq({kind:'dline',lo,k,ans:v,mc:true,opts:[lo+k/100,k,lo+(10-k)/10,lo+(k+1)/10,lo+(k-1)/10],
    disp:'The arrow points to □',say:'What number is the arrow pointing to?',
    h:`The line from ${lo} to ${lo+1} is split into 10 equal jumps. Each jump is 0.1. Count the jumps from ${lo}.`,
    ex:`${k} jump${k>1?'s':''} of 0.1 from ${lo} lands on ${fd(v)}.`,eqs:`${lo} + ${k} tenths = ${fd(v)}`})}
function dWholeQ(){const w=rnd(1,3),k=rnd(1,9),v=w+k/10,t=w*10+k,r=Math.random();
  if(r<.34)return dq({kind:'dbar',n:t,ans:t,novis:true,disp:`${fd(v)} = □ tenths`,say:`${fd(v)}. How many tenths is that altogether?`,
    h:`Each whole is 10 tenths. ${w} whole${w>1?'s':''} = ${w*10} tenths. Then add the ${k} tenths.`,ex:`${w} whole${w>1?'s':''} = ${w*10} tenths, plus ${k} more = ${t} tenths.`,eqs:`${fd(v)} = ${t} tenths`});
  if(r<.67)return dq({kind:'dbar',n:t,ans:v,novis:true,disp:`${t} tenths = □`,say:`${t} tenths. Write it as a decimal.`,
    h:`10 tenths make 1 whole. How many wholes can you make from ${t} tenths? How many tenths are left?`,ex:`${t} tenths = ${w} whole${w>1?'s':''} and ${k} tenths = ${fd(v)}.`,eqs:`${t} tenths = ${fd(v)}`});
  return dq({kind:'dbar',n:t,ans:v,disp:'Shaded = □',say:'Each bar is one whole, cut into tenths. What decimal is shaded?',
    h:'Each full bar is a whole one. The part-bar shows the tenths.',ex:`${w} full bar${w>1?'s':''} and ${k} tenths = ${fd(v)}.`,eqs:`${w} + 0.${k} = ${fd(v)}`})}
function dCmpQ(hund){let a,b;
  if(!hund){a=rnd(1,29)/10;do{b=rnd(1,29)/10}while(same(a,b)||Math.abs(a-b)>1.2)}
  else if(Math.random()<.65){const t=rnd(2,9);a=t/10;b=(t-1)/10+rnd(1,9)/100;if(Math.random()<.3){const w=rnd(1,3);a+=w;b+=w}} // the longer number is not the bigger one
  else{a=rnd(101,399)/100;do{b=r3(a+rnd(-30,30)/100)}while(same(a,b)||b<=0)}
  a=r3(a);b=r3(b);const big=Math.random()<.75,ans=big?Math.max(a,b):Math.min(a,b),lo=Math.min(a,b),hi=Math.max(a,b);
  return dq({kind:'dcmp',ans,mc:true,two:true,opts:[a,b],disp:`Which is ${big?'bigger':'smaller'}?<br>□`,say:`Which is ${big?'bigger':'smaller'}, ${fd(a)} or ${fd(b)}?`,
    h:hund?'Line up the decimal points. Compare the ones, then the tenths. More digits does NOT mean bigger!':'Compare the whole numbers first. If they are the same, compare the tenths.',
    ex:`${fd(hi)} is bigger than ${fd(lo)}.`+(hund?` With 2 places each: ${hi.toFixed(2)} and ${lo.toFixed(2)}.`:''),eqs:`${fd(hi)} &gt; ${fd(lo)}`})}
function dOrderQ(){const t=rnd(2,8),set=[t/10,(t-1)/10+rnd(1,9)/100,t/100,(t+1)/10].map(r3),small=Math.random()<.5,ans=small?Math.min(...set):Math.max(...set),up=set.slice().sort((x,y)=>x-y);
  return dq({kind:'dcmp',ans,mc:true,opts:set,disp:`Which is the ${small?'smallest':'biggest'}?<br>□`,say:`Which is the ${small?'smallest':'biggest'}?`,
    h:'Imagine every number with 2 decimal places, like money. Then compare.',ex:`As hundredths: ${up.map(x=>x.toFixed(2)).join(' &lt; ')}.`,eqs:up.map(fd).join(' &lt; ')})}
function dAddQ(){let A=rnd(2,25),B=rnd(2,15);if(A%10===0)A++;if(B%10===0)B++;const S=A+B;
  return dq({kind:'dadd',A,B,ans:S/10,novis:true,disp:`${fd(A/10)} + ${fd(B/10)} = □`,say:`${fd(A/10)} plus ${fd(B/10)}`,
    h:`Think in tenths: ${A} tenths + ${B} tenths = ? tenths.`,ex:`${A} tenths + ${B} tenths = ${S} tenths = ${fd(S/10)}.`,eqs:`${fd(A/10)} + ${fd(B/10)} = ${fd(S/10)}`})}
function dSubQ(){let A=rnd(8,30);if(A%10===0)A++;let B=rnd(2,A-1);if(B%10===0)B--;const D=A-B;
  return dq({kind:'dsub',A,B,ans:D/10,novis:true,disp:`${fd(A/10)} − ${fd(B/10)} = □`,say:`${fd(A/10)} minus ${fd(B/10)}`,
    h:`Think in tenths: ${A} tenths take away ${B} tenths.`,ex:`${A} tenths − ${B} tenths = ${D} tenths = ${fd(D/10)}.`,eqs:`${fd(A/10)} − ${fd(B/10)} = ${fd(D/10)}`})}
function dGridQ(){let n=rnd(11,99);if(n%10===0)n++;const t=Math.floor(n/10),o=n%10;
  return dq({kind:'dgrid',n,ans:n/100,mc:true,opts:[n/10,(o*10+t)/100,(100-n)/100,n],disp:'Shaded part = □',
    say:'The big square is one whole, cut into 100 small squares. What decimal is shaded?',
    h:'Each full column is one tenth (0.1). Each small square is one hundredth (0.01).',
    ex:`${t} full column${t>1?'s':''} = 0.${t}, plus ${o} small square${o>1?'s':''} = 0.0${o}. That is ${n} hundredths = ${fd(n/100)}.`,eqs:`${fr(n,100)} = ${fd(n/100)}`})}
function dPlaceQ(){const [w,t,h]=shuffle(range(1,9)).slice(0,3),num=(w+t/10+h/100).toFixed(2),pos=pick(['w','t','t','h','h']),d=pos==='w'?w:pos==='t'?t:h,val=pos==='w'?w:pos==='t'?t/10:h/100;
  return dq({kind:'dplace',num,ans:val,mc:true,opts:[d,d/10,d/100,d*10],disp:`In <b class="dnum">${num}</b><br>the ${d} is worth □`,say:`In ${num}, what is the ${d} worth?`,
    h:'Ones, then the point, then tenths, then hundredths. Which place is the digit in?',ex:`${num} = ${w} ones, ${t} tenths and ${h} hundredths. So the ${d} is worth ${fd(val)}.`,eqs:`${num} = ${w} + ${fd(t/10)} + ${fd(h/100)}`})}
function dExpandQ(){const [w,t,h]=shuffle(range(1,9)).slice(0,3),num=(w+t/10+h/100).toFixed(2),askT=Math.random()<.5;
  return dq({kind:'dplace',num,ans:askT?t/10:h/100,disp:askT?`${num} = ${w} + □ + ${fd(h/100)}`:`${num} = ${w} + ${fd(t/10)} + □`,say:`Fill the gap to make ${num}.`,

  const mk=(x,op,m,ans)=>dq({kind:'dx',ans,disp:`${fd(x)} ${op} ${m} = □`,say:`${fd(x)} ${op==='×'?'times':'divided by'} ${m}`,
    h:op==='×'?`× ${m} makes every digit ${m} times bigger: the digits move ${m===10?'one place':'two places'} to the LEFT.`:`÷ ${m} makes every digit ${m} times smaller: the digits move ${m===10?'one place':'two places'} to the RIGHT.`,
    ex:`${fd(x)} ${op} ${m} = ${fd(ans)}. The digits moved ${m===10?'one place':'two places'} ${op==='×'?'left':'right'}.`,eqs:`${fd(x)} ${op} ${m} = ${fd(ans)}`});
  if(r===0){let n=rnd(1,99);if(n%10===0)n++;return mk(n/10,'×',10,n)}

/* ---------------- save migration: map v1 → v2 (multiplication-first) ---------------- */
function migrateMap(x){
  if(!x||x.v!==1||x.mapV===2)return x;
  const o=x.stars||{},n={},g=(id,i)=>o[id+'-'+i]||0;
  const put=(id,i,v)=>{if(v)n[id+'-'+i]=Math.max(n[id+'-'+i]||0,v)};
  if(g('cloud',0))put('cloud',0,g('cloud',0));
  for(let i=0;i<5;i++)put('cloud',i+1,g('cloud',i));put('cloud',6,g('cloud',5));
  for(const i of[0,1,2])put('moon',i,g('moon',i));put('moon',4,g('moon',4));put('moon',5,g('moon',3));if(g('moon',4))put('moon',3,g('moon',4));put('moon',6,g('moon',5));
  for(const i of[0,1,2])put('star',i,g('star',i));put('star',5,g('star',3));if(g('star',3)){put('star',3,g('star',3));put('star',4,g('star',3))}put('star',6,g('star',5));put('library',0,g('star',4));
  for(const i of[0,1,2,3])put('meadow',i,g('meadow',i));put('meadow',4,g('library',3)||g('meadow',4));put('meadow',5,g('library',4));put('meadow',6,g('meadow',5));
  for(let i=0;i<6&&g('lumen',i);i++)put('lumen',i,g('lumen',i));
  for(const id of['cloud','moon','star','meadow']){let last=0;for(let i=6;i>=0;i--){if(n[id+'-'+i])last=1;else if(last)n[id+'-'+i]=1}}
  x.stars=n;x.mapV=2;return x;
}

function setupDraw(cv,tool,onStart,onEnd){
  const ctx=cv.getContext('2d');let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const t=tool(),p=pos(e);onStart&&onStart();
    if(t.stamp){ctx.font=`${t.size*4+20}px "Segoe UI Emoji","Apple Color Emoji",serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.stamp,p.x,p.y);onEnd&&onEnd();return}
    drawing=true;last=p;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=t.color;ctx.lineWidth=t.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e),t=tool();ctx.strokeStyle=t.color;ctx.lineWidth=t.size;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
  const end=()=>{if(drawing){drawing=false;onEnd&&onEnd()}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return ctx;
}

  <h3 class="sub">How the game is designed</h3><div class="notes"><ul style="padding-left:18px;margin:0">
   <li><b>Built for ages 9+.</b> Warrior Academy runs on the same maths engine as Whisker Academy's Big Paws track: times tables and division first, then decimals (tenths in The Jolly Tavern, hundredths and money in Smugglers’ Cove), remainders and two-step problems that mix all four operations. Addition and subtraction realms are bonus practice. Every times-table and division fact has its own memory box, and each times table has a crystal that lights up as its facts become strong over several days.</li>
   <li><b>Secret code.</b> Each player picks a 4-number code that is asked when signing in by name, so brothers, sisters and friends can't open each other's game by accident. It's a kid-proof lock, not bank-grade security.</li>
   <li><b>Calm music and celebrations.</b> Soft background music made live in the browser (tap 🎵 to turn it off), a jingle when a lesson ends, and victory moves for the knight, bought with gold.</li>
   <li><b>Spaced repetition.</b> Every fact sits in its own memory box. Facts answered correctly come back after 1, 2, 4, 7 then 14 days. Missed facts come back sooner. Due facts are mixed into levels and the Review Forge.</li>
   <li><b>Retrieval and interleaving.</b> Answers are typed from memory, not just picked. Older facts are mixed in with new ones, which builds longer-lasting memory than practising one table at a time.</li>
   <li><b>The right amount of challenge (~85% success).</b> Each realm starts with picture-supported multiple choice, then moves to recall. The first miss gives a clue. A second miss shows a worked picture explanation, and the same question comes back later in the level.</li>
   <li><b>Concrete → pictorial → abstract</b> (Singapore maths). Arrays, ten-frames, tenths bars and hundred squares show <i>why</i> the answer works.</li>
   <li><b>Strategies, not just memorising.</b> Make-10, doubles and near doubles, ×9 = ×10 − 1, ×4 = double double, ×7 = ×5 + ×2.</li>
   <li><b>Growth-mindset feedback</b> (Dweck). Praise is for effort, strategy and fixing mistakes, never "you're so clever". Mistakes are shown as how warriors get stronger.</li>
   <li><b>No time pressure by default</b> (Boaler: timed tests drive maths anxiety). The Lightning Round is optional, and players only race their own best score.</li>
   <li><b>Self-Determination Theory.</b> Autonomy (they pick the realm, table and gear), competence (stars, mastery bars) and relatedness (a named knight who cheers them on).</li>
   <li><b>Game loop, made kind.</b> Short 2–4 minute levels, 3-star ratings, a level map, combos, mystery gifts, a sticker collection and a daily gift. There are <b>no</b> lives in the maths, no losing, no ads and no purchases. A missed day is forgiven, and a break reminder pops up after a set time.</li>
   <li><b>Bonus game, earned not given: Halving Blade.</b> Numbers from 1 to 100 fall down the screen and a swipe cuts one in half. Even numbers split into whole halves (8 → 4 + 4), odd numbers into decimals (7 → 3.5 + 3.5), and each half hops up and can be cut again (3.5 → 1.75 + 1.75), up to 4 cuts or 3 decimal places. Every cut shows the sum, such as 7 ÷ 2 = 3.5, and blacksmith orders ask for one exact half, so players work out halving chains like 25 → 12.5 → 6.25. It unlocks only after ${BONUS.mins.big} minutes of learning with ${BONUS.right.big} right answers. Only time spent answering counts, a 20-minute break restarts the count, and it is limited to ${BONUS.perDay} plays a day. A round lasts a minute. ${S.bonus&&S.bonus.plays?`Played ${S.bonus.plays} time${S.bonus.plays>1?'s':''} so far, best score ${S.bonus.best}.`:''}</li>
   <li><b>Victory move.</b> Moves bought with gold can be picked in the Armoury. The knight does it at the end of every level.</li>
   <li><b>Tips:</b> 10–15 minutes a day works better than one long session. Ask them to teach <i>you</i> a strategy. Celebrate effort and the tricky facts they conquer.</li>
  </ul></div>`;
}

function buildQueue(gen,n,{review=true}={}){
  const qs=[],seen=new Set();let guard=0;
  while(qs.length<n&&guard++<300){const q=gen();const sig=q.text+(q.word||'')+'|'+q.ans+(q.emo||'');if(seen.has(sig)&&guard<200)continue;seen.add(sig);qs.push(q)}
  if(review&&n>=8){const due=shuffle(dueFacts().filter(k=>!qs.some(q=>q.key===k))).slice(0,2);due.forEach((k,j)=>{const q=factToQ(k);q.review=true;qs[j===0?3:6]=q})}
  return qs;
}

const GUIDE_KINDS=['count','picadd','picsub','bond','hide','share','half','grouping','lgroups','lskip','tenplus','next'];
function canGuide(q){return GUIDE_KINDS.includes(q.kind)||(!q.kind&&!q.missing&&((q.op==='+'&&q.a<=10&&q.b<=10)||(q.op==='−'&&q.a<=20)))}
function guideSteps(q){
  const V=$('#qvis');if(!V)return [];
  if(['share','half','grouping','hide'].includes(q.kind)){V.innerHTML=visual(q,true);V.querySelectorAll('.cap').forEach(c=>c.remove())}
  V.querySelectorAll('.counted').forEach(el=>{el.classList.remove('counted');delete el.dataset.n});
  const all=sel=>[...V.querySelectorAll(sel)],seq=(els,start=1,by=1)=>els.map((el,i)=>({el,n:start+i*by}));
  switch(q.kind){
    case 'count':return seq(all('.cgrid span'));
    case 'picadd':return seq(all('.picadd .pe'));
    case 'picsub':return seq(all('.picadd .pe:not(.gone)'));
    case 'bond':return seq(all('.tf i.e'));
    case 'hide':return seq(all('.burrow .pe'));
    case 'share':case 'half':{const pl=V.querySelector('.plate');return pl?seq([...pl.querySelectorAll('.pe')]):[]}
    case 'grouping':return seq(all('.g1'));
    case 'lgroups':case 'lskip':return seq(all('.g1'),q.b,q.b);
    case 'tenplus':{const f=V.querySelector('.tf');return f?[{el:f,n:10}].concat(seq(all('.tf i.b'),11)):[]}
    case 'next':return seq(all('.track b').slice(0,q.n));

function runGuide(q){

  let i=0;const gap=steps.length>12?560:720;
  const step=()=>{if(P!==myP||P.guideTok!==tok)return;
    if(i>=steps.length){P.guiding=false;P.locked=false;if(box)box.classList.remove('guiding');P.enabledAt=Date.now();
      const end=q.kind==='next'?'What comes next?':q.kind==='grouping'?'So how many bags?':q.kind==='share'||q.kind==='half'?'So how many does each knight get?':'So how many?';
      setTimeout(()=>{if(P!==myP)return;setCoach(end+' You tap it! 👆','happy');speak(end)},gap);return}
    const {el,n}=steps[i++];el.classList.add('counted');el.dataset.n=n;sfx.tap();speak(String(n));setTimeout(step,gap)};

/* ---------------- bonus game: Halving Blade ----------------
   Earned, never handed out: a play pass needs a stretch of real learning (minutes spent answering, plus enough right answers).
   At most 2 passes a day and 3 saved up. A break of 20+ minutes starts the stretch again.
   Numbers fall. A swipe cuts one into two halves that hop apart and keep falling, so each half can be cut again:
   8 → 4 + 4, 7 → 3.5 + 3.5, 3.5 → 1.75 + 1.75. A piece stops splitting after 4 cuts, or when halving it would need
   more than 3 decimal places, and shatters into gold instead. Blacksmith orders ask for one exact half (6.25, say),
   so the player has to spot which falling number halves down to it. */
const BONUS={mins:{little:10,middle:15,big:15},right:{little:15,middle:25,big:30},perDay:2,maxHeld:3,resetMins:20};
function bonusState(){if(!S.bonus||typeof S.bonus!=='object')S.bonus={};const b=S.bonus,t=dayKey();for(const k of['learn','right','passes','today','best','last','plays'])b[k]=b[k]||0;if(b.day!==t){b.day=t;b.today=0}return b}
function bonusNeed(){const bd=band();return{secs:BONUS.mins[bd]*60,right:BONUS.right[bd]}}
function bonusCapped(){const b=bonusState();return b.today>=BONUS.perDay||b.passes>=BONUS.maxHeld}
function bonusTick(){const b=bonusState(),now=Date.now();
  if(UI.screen==='play'&&P&&P.lastAns&&now-P.lastAns<45000){b.learn+=10;b.last=now;bonusCheck()}
  else if(b.last&&now-b.last>BONUS.resetMins*60000&&(b.learn||b.right)&&!bonusCapped()){b.learn=0;b.right=0}}
function bonusRight(){const b=bonusState();b.right++;bonusCheck()}
function bonusCheck(){const b=bonusState(),n=bonusNeed();if(bonusCapped()){b.learn=Math.min(b.learn,n.secs);return}
  if(b.learn>=n.secs&&b.right>=n.right){b.passes++;b.today++;b.learn=0;b.right=0;UI.passNew=true;save();
    toast(`<span class="ti">🎟️</span><div><b>Bonus game earned!</b><br>Finish this round, then play Halving Blade from the map.</div>`);sfx.fanfare()}}
function bonusCard(){const b=bonusState(),n=bonusNeed();
  if(b.passes>0)return `<div class="bonuscard ready"><div class="bi">⚔️</div><div class="grow"><b>Halving Blade</b><div class="tiny">You earned ${b.passes} bonus play${b.passes>1?'s':''} by learning! 🎟️</div></div><button class="btn sun" data-act="bonus">Play ▶</button></div>`;
  if(bonusCapped())return `<div class="bonuscard"><div class="bi">🌙</div><div class="grow"><b>Halving Blade</b><div class="tiny">You earned today's bonus games. Mighty learning! More tomorrow.</div></div></div>`;
  const p=Math.min(b.learn/n.secs,b.right/n.right,1);
  return `<div class="bonuscard" data-act="bonus" role="button"><div class="bi">🔒</div><div class="grow"><b>Bonus game: Halving Blade</b><div class="meter"><i style="width:${Math.round(p*100)}%"></i></div><div class="tiny">Unlocks after ${n.secs/60} minutes of learning with ${n.right} right answers: ${Math.floor(b.learn/60)}/${n.secs/60} min · ${Math.min(b.right,n.right)}/${n.right} right</div></div></div>`}
function passBanner(){if(!UI.passNew)return '';UI.passNew=false;return `<div class="passban">🎟️ <b>You earned a bonus game!</b> <button class="chip" data-act="bonus">Play Halving Blade ▶</button></div>`}

const HB={dur:60,maxCuts:4,maxOnScreen:42,colors:['#3b6fd8','#2f9e68','#e09b12','#d0583a','#7a4fd0']};
const halfOk=v=>Math.round(v*1000)%2===0; // halving keeps it to 3 decimal places
let TB=null;
function startBonus(){
  const b=bonusState(),n=bonusNeed();closeModal();
  if(b.passes<1)return modal(`<h2>⚔️ Halving Blade</h2><div style="font-size:40px;font-weight:800">7 → 3.5 + 3.5</div><p>A bonus game you <b>earn by learning</b>.</p><p class="tiny">Spend ${n.secs/60} minutes learning and get ${n.right} answers right (a long break starts the count again). You can earn ${BONUS.perDay} a day.</p><button class="btn" data-act="close">OK</button>`);
  b.passes--;b.plays++;save();
  const d=document.createElement('div');d.id='blade';
  d.innerHTML=`<div class="hb-sky">${['8%:6%','20%:30%','6%:58%','14%:82%','30%:14%','26%:70%'].map((v,i)=>{const [t,l]=v.split(':');return `<i class="sc-star" style="top:${t};left:${l};animation-delay:${i*.4}s"></i>`}).join('')}<span class="hb-moon">🌕</span><span class="hb-castle">🏰</span></div>
   <div class="tb-hud"><div class="pill">⭐ <b id="hbScore">0</b></div><div class="pill" id="hbLives">❤️❤️❤️</div><div class="pill tb-mult" id="hbPow"></div><button class="xbtn" data-act="tbQuit" aria-label="Stop the game">✕</button></div>
   <div class="tb-timer"><i id="hbTime"></i></div>
   <div class="hb-order" id="hbOrder"></div>
   <div class="hb-field" id="hbField"><canvas id="hbCv"></canvas></div>
   <div class="tb-msg" id="tbMsg"><div class="tb-card"><h2>Halving Blade ⚔️</h2>
    <div class="hb-demo"><b>8</b> → <b>4</b> + <b>4</b><br><b>7</b> → <b>3.5</b> + <b>3.5</b><br><b>3.5</b> → <b>1.75</b> + <b>1.75</b></div>
    <div class="tb-how"><div><b>👆</b>Swipe to slice a number in half</div><div><b>🔁</b>Slice the halves again before they fall</div><div><b>📜</b>Make the blacksmith's number for big points</div><div><b>💀</b>Don't slice the cursed skulls</div></div>
    <button class="btn big" data-act="tbGo">Start ▶</button></div></div>`;
  document.body.appendChild(d);
  const f=d.querySelector('#hbField'),cv=d.querySelector('#hbCv');
  TB={run:false,field:f,cv,ctx:cv.getContext('2d'),sw:null,trail:[]};
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{if(!TB||!TB.run)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);TB.sw={last:p,count:0};TB.trail.push({x:p.x,y:p.y,t:TB.t})});
  cv.addEventListener('pointermove',e=>{if(!TB||!TB.run||!TB.sw)return;const p=pos(e);hbSwipe(TB.sw.last,p);TB.sw.last=p;TB.trail.push({x:p.x,y:p.y,t:TB.t})});
  const up=()=>{if(!TB||!TB.sw)return;const c=TB.sw.count;TB.sw=null;if(c>=3&&TB.run){const g=c*2;TB.score+=g;hbText(TB.W/2,TB.H*.3,`${c===3?'Triple':c===4?'Quad':'Mega'} slice! +${g}`,'#ffd23d',30);sfx.twinkle();hbHud()}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  if(readAloud())speak('Halving Blade! Swipe to slice the numbers in half. Do not slice the skulls!');
}
function hbSize(){const T=TB,W=T.field.clientWidth,H=T.field.clientHeight;if(W===T.W&&H===T.H)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);T.W=W;T.H=H;T.cv.width=Math.round(W*dpr);T.cv.height=Math.round(H*dpr);T.cv.style.width=W+'px';T.cv.style.height=H+'px';T.ctx.setTransform(dpr,0,0,dpr,0,0);T.R=Math.max(30,Math.min(54,Math.min(W,H)*.075))}
function tbGo(){if(!TB)return;
  Object.assign(TB,{W:0,H:0,pieces:[],fx:[],texts:[],trail:[],t:0,spawn:.3,lives:3,score:0,cuts:0,orders:0,pow:{},order:null,orderNext:2.5,queue:[],dur:HB.dur,paused:false,shown:-1});
  hbSize();
  const m=$('#tbMsg');let n=3;const cd=()=>{if(!TB)return;if(n>0){m.innerHTML=`<div class="tb-count">${n}</div>`;sfx.tap();n--;setTimeout(cd,700)}else{m.innerHTML='';TB.run=true;TB.last=performance.now();requestAnimationFrame(tbLoop)}};cd()}
function hbSpawn(kind,v){const T=TB,r=kind==='num'?T.R:T.R*.9;
  T.pieces.push({kind,v,r,x:r+Math.random()*(T.W-2*r),y:-r,vx:(Math.random()-.5)*T.W*.1,vy:T.H*(.05+Math.random()*.07),cuts:0,born:T.t,rot:(Math.random()-.5)*.4,vr:(Math.random()-.5)*1.2})}
function hbPick(){const T=TB,prog=Math.min(1,T.t/T.dur),x=Math.random();
  if(x<.07+.09*prog&&T.t>3)return hbSpawn('skull');
  if(x>.965&&T.t>8&&!(T.pow.slow>T.t)&&!(T.pow.fire>T.t))return hbSpawn(Math.random()<.5?'slow':'fire');
  if(T.queue.length&&Math.random()<.55)return hbSpawn('num',T.queue.shift());
  hbSpawn('num',rnd(1,100))}
function hbNewOrder(){const T=TB;let n,k,tries=0;
  do{n=rnd(3,100);k=rnd(1,3)}while(n%Math.pow(2,k)===0&&tries++<20); // aim for a decimal half most of the time
  const tgt=r3(n/Math.pow(2,k));T.order={T:tgt,n,k,at:T.t};T.queue.push(n);setTimeout(()=>{if(TB&&TB.order&&TB.order.n===n)TB.queue.push(n)},6000);
  hbOrderHTML();sfx.hint()}
function hbChain(o){const s=[o.n];for(let i=0;i<o.k;i++)s.push(r3(s[s.length-1]/2));return s.join(' → ')}
function hbOrderHTML(){const T=TB,el=$('#hbOrder');if(!el)return;const o=T.order;
  el.innerHTML=o?`📜 Blacksmith's order: make a <b>${r3(o.T)}</b>${T.t-o.at>10?`<span class="hb-hint">Try ${hbChain(o)}</span>`:''}`:'';el.classList.toggle('on',!!o)}
function hbText(x,y,txt,col='#fff',size=22,life=1){TB.texts.push({x,y,txt,col,size,life,max:life})}
function hbBurst(x,y,col,n=10,coins=0){const T=TB;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(.15+Math.random()*.35)*T.R*8;T.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-T.R*3,life:.6+Math.random()*.3,col,e:i<coins?'🪙':null})}}
function hbSwipe(a,b){const T=TB,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<2)return;
  for(const p of T.pieces.slice()){if(p.dead||T.t-p.born<.22)continue;
    const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(len*len))),cx=a.x+dx*t,cy=a.y+dy*t;
    if(Math.hypot(p.x-cx,p.y-cy)<p.r)hbCut(p,dx/len,dy/len)}}
function hbCut(p,ux,uy){const T=TB;p.dead=true;T.pieces.splice(T.pieces.indexOf(p),1);
  T.fx.push({slash:1,x:p.x,y:p.y,ux,uy,r:p.r,life:.18});
  if(p.kind==='skull'){T.lives--;T.flash=.35;sfx.wrong();hbText(p.x,p.y,'💀 Cursed!','#ff6b6b',26);hbBurst(p.x,p.y,'#9b6bff',12);hbHud();if(T.lives<=0)tbEnd('lives');return}
  if(p.kind==='slow'){T.pow.slow=T.t+6;sfx.chest();hbText(T.W/2,T.H*.35,'⏳ Slow motion!','#bfe3ff',30,1.4);hbHud();return}
  if(p.kind==='fire'){T.pow.fire=T.t+8;sfx.chest();hbText(T.W/2,T.H*.35,'🔥 Flaming blade! ×2','#ffb03d',30,1.4);hbHud();return}
  const mult=T.pow.fire>T.t?2:1;if(T.sw)T.sw.count++;T.cuts++;
  if(p.cuts<HB.maxCuts&&halfOk(p.v)){
    const h=r3(p.v/2),nx=-uy,ny=ux,jump=T.H*(.4-.03*p.cuts),spread=T.W*.15,r=Math.max(T.R*.6,p.r*.88);
    const kids=[-1,1].map(s=>({kind:'num',v:h,r,x:p.x+nx*s*p.r*.45,y:p.y+ny*s*p.r*.45,vx:p.vx*.3+nx*s*spread,vy:-jump+ny*s*spread*.3,cuts:p.cuts+1,born:T.t,rot:0,vr:0,gold:p.gold}));
    T.pieces.push(...kids);T.score+=mult;
    hbText(p.x,p.y-p.r,`${r3(p.v)} ÷ 2 = ${h}`,'#fff',Math.max(16,T.R*.42),1.1);
    tone(1500-p.cuts*180,.09,'triangle',.05,0,600);
    if(T.order&&same(h,T.order.T)){const g=15+5*T.order.k;T.score+=g*mult;T.orders++;kids.forEach(k=>k.gold=true);
      hbText(T.W/2,T.H*.42,`Order forged! +${g*mult} 🔨`,'#ffd23d',32,1.6);hbBurst(p.x,p.y,'#ffd23d',16,4);sfx.chest();T.order=null;T.orderNext=T.t+1.6;hbOrderHTML()}
  }else{T.score+=2*mult;hbBurst(p.x,p.y,'#ffd23d',10,3);hbText(p.x,p.y,`+${2*mult}`,'#ffd23d',24);tone(1900,.12,'sine',.05);tone(2500,.14,'sine',.04,.06)}
  hbHud()}
function hbHud(){const T=TB,s=$('#hbScore');if(!s)return;s.textContent=T.score;$('#hbLives').textContent='❤️'.repeat(Math.max(0,T.lives))+'🤍'.repeat(Math.max(0,3-T.lives));
  const pw=$('#hbPow'),txt=(T.pow.fire>T.t?'🔥 ×2 ':'')+(T.pow.slow>T.t?'⏳ slow':'');pw.textContent=txt;pw.classList.toggle('on',!!txt)}
function tbLoop(now){const T=TB;if(!T||!T.run)return;if(T.paused){T.last=now;return requestAnimationFrame(tbLoop)}
  const raw=Math.max(0,Math.min(.05,(now-T.last)/1000));T.last=now;T.t+=raw;hbSize();
  const prog=Math.min(1,T.t/T.dur),slow=T.pow.slow>T.t,dt=raw*(slow?.45:1),g=T.H*(.2+.12*prog);
  T.spawn-=dt;if(T.spawn<=0){if(T.pieces.length<HB.maxOnScreen)hbPick();T.spawn=Math.max(.5,1.05-.45*prog)*(.8+Math.random()*.4)}
  if(!T.order&&T.t>=T.orderNext)hbNewOrder();
  if(T.order&&T.t-T.order.at>24){hbText(T.W/2,T.H*.4,'Order gone… here comes a new one!','#fff',22,1.4);T.order=null;T.orderNext=T.t+1;hbOrderHTML()}
  if(T.order&&T.t-T.order.at>10&&!T.order.hinted){T.order.hinted=true;hbOrderHTML()}
  for(let i=T.pieces.length-1;i>=0;i--){const p=T.pieces[i];p.vy+=g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.x<p.r){p.x=p.r;p.vx=Math.abs(p.vx)*.6}if(p.x>T.W-p.r){p.x=T.W-p.r;p.vx=-Math.abs(p.vx)*.6}
    if(p.y>T.H+p.r*1.2)T.pieces.splice(i,1)}
  for(let i=T.fx.length-1;i>=0;i--){const f=T.fx[i];f.life-=raw;if(f.life<=0){T.fx.splice(i,1);continue}if(!f.slash){f.vy+=g*1.4*raw;f.x+=f.vx*raw;f.y+=f.vy*raw}}
  for(let i=T.texts.length-1;i>=0;i--){const x=T.texts[i];x.life-=raw;x.y-=24*raw;if(x.life<=0)T.texts.splice(i,1)}
  T.trail=T.trail.filter(p=>T.t-p.t<.16);
  if(T.flash)T.flash=Math.max(0,T.flash-raw);
  hbDraw();
  const left=Math.max(0,T.dur-T.t),tl=$('#hbTime');if(tl)tl.style.width=(left/T.dur*100)+'%';
  if(Math.ceil(left)!==T.shown){T.shown=Math.ceil(left);hbHud()}

function hbDraw(){const T=TB,c=T.ctx;c.clearRect(0,0,T.W,T.H);

  if(T.trail.length>1){const fire=T.pow.fire>T.t;c.lineCap='round';c.lineJoin='round';c.shadowColor=fire?'#ff7a1a':'#9fd0ff';c.shadowBlur=14;
    for(let i=1;i<T.trail.length;i++){const a=T.trail[i-1],b=T.trail[i],k=1-(T.t-b.t)/.16;c.strokeStyle=fire?`rgba(255,190,90,${k})`:`rgba(255,255,255,${k})`;c.lineWidth=2+k*9;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}c.shadowBlur=0}
  for(const x of T.texts){c.globalAlpha=Math.min(1,x.life/x.max*2);c.font=`800 ${Math.round(x.size)}px 'Baloo 2',system-ui,sans-serif`;c.textAlign='center';c.textBaseline='middle';c.lineWidth=5;c.strokeStyle='rgba(20,28,48,.85)';c.strokeText(x.txt,x.x,x.y);c.fillStyle=x.col;c.fillText(x.txt,x.x,x.y);c.globalAlpha=1}}

/* ---------------- daily gift & streak ---------------- */
function checkDaily(){
  const t=dayKey();if(!S.name||S.giftDay===t||needsSetup())return;
  const last=S.streak.last;let napped=false;
  if(!last)S.streak.count=1;
  else{const gap=daysBetween(last,t);if(gap===1)S.streak.count++;else if(gap===2){S.streak.count++;napped=true}else if(gap>2)S.streak.count=1}
  S.streak.last=t;S.giftDay=t;
  const day=S.streak.count,y=10+5*Math.min(day,6);S.yarn+=y;
  let st=null;if(day%7===0)st=rollReward(true);
  if(day>=3)badge('streak3');if(day>=7)badge('streak7');save();
  const wk=((day-1)%7)+1;
  modal(`<h2>Daily gift! 🎁</h2>${catHTML(cs(120),'happy',{cls:'bounce'})}<p><b>Day ${day}</b> in a row${day>1?' — amazing!':'. Welcome!'}</p>
   <div style="font-size:30px;letter-spacing:4px">${range(1,7).map(i=>i<=wk?'🔥':'⚪').join('')}</div>
   <p>+${y} 🪙 ${st?`<br>Day 7 bonus: <b>${st.s[2]}</b> ${st.s[1]} sticker!`:'<br><span class="tiny">Come back every day: the gift grows, and day 7 has a special sticker!</span>'}</p>
   ${napped?`<p class="nudge">🛡️ ${esc(catName())} stood guard for you yesterday and kept your streak safe!</p>`:''}
   <button class="btn big" data-act="close" style="margin-top:8px">Yay!</button>`);
  sfx.chest();confetti(40);
}

    const ang=Math.random()*Math.PI*2,d=spread*(.4+Math.random()*.8);p.style.left=x+'px';p.style.top=y+'px';
    p.style.setProperty('--dx',Math.cos(ang)*d+'px');p.style.setProperty('--dy',(Math.sin(ang)*d-30)+'px');p.style.setProperty('--rot',rnd(-90,90)+'deg');
    document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
}
function confetti(n=50){

  for(let k=0;k<n;k++){const c=document.createElement('span');c.className='cf';c.textContent=pick(em);c.style.left=Math.random()*100+'vw';
    const dur=1.6+Math.random()*1.4;c.style.animationDuration=dur+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.setProperty('--rot',rnd(-360,360)+'deg');c.style.fontSize=rnd(16,30)+'px';

/* ---------------- name sign-in + secret code ---------------- */
function nameKey(n){return String(n||'').trim().replace(/\s+/g,' ').toLowerCase()}
function cyrb53(str,seed=7){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function pinHash(name,pin){return 'p1:'+cyrb53(nameKey(name)+'#warrior#'+pin)}
function needsSetup(){return !!S.name&&(!S.pinHash||!S.age)}
function renderSetup(){setTheme('meadow');app.classList.remove('playing');if(!S.pinHash){if(!UI.pin||UI.pin.ctx!=='setup')UI.pin={mode:'new',ctx:'setup',val:'',first:''};app.innerHTML=pinHTML();return}UI.pin=null;app.innerHTML=ageHTML('setup')}
function pinHTML(){
  const p=UI.pin,pend=UI.pending&&UI.pending.data,nm=pend?pend.name:(p.ctx==='onboard'?UI.tmpName:S.name);
  let title,sub;
  if(p.mode==='enter'){title=`Hi ${esc(nm)}! 👋`;sub='Type your secret code'}
  else if(p.mode==='confirm'){title='Type it one more time';sub='Just to make sure you remember it!'}
  else if(p.ctx==='onboard'&&pend){title=`Welcome back, ${esc(nm)}! 💖`;sub='Your game needs a secret code now. Pick 4 numbers you will remember.'}
  else if(p.ctx==='setup'){title='New! Make your secret code 🔐';sub='Pick 4 numbers you will remember. You need them to sign in to your game.'}
  else if(p.ctx==='change'){title='Pick a new secret code 🔐';sub=`This will be ${esc(nm)}'s new code.`}
  else{title='Make a secret code 🔐';sub='Pick 4 numbers you will remember. You need them to sign in.'}
  const catOpts=pend?{fur:pend.fur,equipped:Object.assign({},pend.equipped||{})}:(S.name?{}:{fur:UI.tmpFur||'ginger',equipped:{}});
  const pad=range(1,9).map(n=>`<button data-act="pinKey" data-k="${n}">${n}</button>`).join('')+'<button data-act="pinKey" data-k="del" aria-label="Delete">⌫</button><button data-act="pinKey" data-k="0">0</button><button class="blank" tabindex="-1" aria-hidden="true"></button>';
  const back=p.ctx==='onboard'?'<button class="chip" data-act="pinBack">◀ Back</button>':p.ctx==='change'?'<button class="chip" data-act="pinBack">Cancel</button>':'';
  return `<div class="onb pinscreen">${catHTML(cs(120),p.err?'wow':'normal',catOpts)}<h2 class="lbl">${title}</h2><p class="lead">${sub}</p><div class="pindots ${p.err?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<p.val.length?'on':''}"></i>`).join('')}</div>${p.err?`<p class="pinerr">${p.err}</p>`:''}<div class="keypad pinpad">${pad}</div><div class="row">${p.mode==='enter'?'<button class="chip" data-act="pinForgot">Forgot your code?</button>':''}${back}</div></div>`;
}
function ageHTML(ctx){
  const nm=ctx==='onboard'?UI.tmpName:S.name,cur=ctx==='onboard'?UI.tmpAge:S.age;
  return `<div class="onb">${ctx==='modal'?'':catHTML(cs(120),'happy',ctx==='onboard'?{fur:UI.tmpFur||'ginger',equipped:{}}:{})}<h2 class="lbl">How old are you, ${esc(nm)}?</h2><p class="lead">So I can pick the right maths for you!</p><div class="ages">${range(9,14).map(a=>`<button class="agebtn ${cur===a?'on':''}" data-act="pickAge" data-age="${a}" data-ctx="${ctx}">${a===14?'14+':a}</button>`).join('')}</div><p class="tiny">A grown-up can change this later in the ⚙️ Grown-ups corner.</p></div>`;
}
function pinKey(k){
  const p=UI.pin;if(!p||p.busy)return;
  if(p.lockUntil&&Date.now()<p.lockUntil){p.err=`Too many tries. Wait ${Math.ceil((p.lockUntil-Date.now())/1000)} seconds, then try again.`;return render()}
  if(k==='del'){p.val=p.val.slice(0,-1);p.err='';sfx.tap();return render()}
  if(p.val.length>=4)return;p.val+=k;p.err='';sfx.tap();render();
  if(p.val.length===4){p.busy=true;setTimeout(()=>{p.busy=false;pinComplete()},260)}
}
function pinComplete(){
  const p=UI.pin;if(!p)return;
  if(p.mode==='enter'){
    const pd=UI.pending.data;
    if(pinHash(pd.name,p.val)===pd.pinHash){sfx.correct(3);return finishLogin(null)}
    p.tries=(p.tries||0)+1;p.val='';sfx.wrong();
    if(p.tries>=5){p.tries=0;p.lockUntil=Date.now()+30000;p.err='Too many tries. Wait 30 seconds, then try again.'}else p.err="That's not the right code. Try again!";
    return render();
  }
  if(p.mode==='new'){p.first=p.val;p.val='';p.mode='confirm';return render()}
  if(p.val!==p.first){p.mode='new';p.val='';p.first='';p.err="Those didn't match. Let's pick it again!";sfx.wrong();return render()}
  const nm=p.ctx==='onboard'?(UI.pending?UI.pending.data.name:UI.tmpName):S.name,h=pinHash(nm,p.val);sfx.chest();
  if(p.ctx==='onboard'){if(UI.pending)return finishLogin(h);UI.tmpPinHash=h;UI.pin=null;UI.onboard='age';return render()}
  UI.pin=null;S.pinHash=h;save();
  if(p.ctx==='change'){UI.tab='parents';render();return toast('<span class="ti">🔐</span><div><b>New secret code saved!</b></div>')}
  toast('<span class="ti">🔐</span><div><b>Secret code saved!</b><br>Use it when you sign in.</div>');afterSetupCheck();
}
function finishLogin(h){const pd=UI.pending;UI.pending=null;UI.pin=null;UI.onboard=0;adopt(pd.data,pd.at);if(h){S.pinHash=h;save()}UI.realm=pickStartRealm();UI.welcomePending=true;afterSetupCheck()}
